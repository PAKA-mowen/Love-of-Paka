<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崩坏：星穹铁道 - 自动下载</title>
    <meta name="description" content="星穹铁道官方自动下载页面，识别设备后自动开始下载">
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --card-bg: rgba(16, 18, 36, 0.85);
            --primary-gold: #d4a843;
            --primary-gold-light: #f0d080;
            --primary-blue: #4a90e2;
            --primary-cyan: #6ad4e0;
            --primary-purple: #8a6bb0;
            --text: #e0e4f0;
            --text-secondary: #a0a8c0;
            --border-subtle: rgba(120, 140, 180, 0.3);
            --border-glow: rgba(212, 168, 67, 0.5);
            --success: #6cc788;
            --card-shadow: 0 8px 40px rgba(0, 0, 0, 0.7), 0 0 80px rgba(74, 144, 226, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #1a1c3b 0%, #0a0a1a 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 动态星空背景 */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            25% {
                opacity: 0.9;
                transform: scale(1.6);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            75% {
                opacity: 0.7;
                transform: scale(1.3);
            }
        }

        /* 星轨线条 */
        .star-trail {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 180, 255, 0.4), rgba(100, 200, 255, 0.7), transparent);
            animation: trailMove var(--trail-dur) linear infinite;
            animation-delay: var(--trail-delay);
            opacity: 0;
        }
        @keyframes trailMove {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateX(100vw);
                opacity: 0;
            }
        }

        /* 主容器 */
        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px 30px 35px;
            position: relative;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            text-align: center;
            overflow: visible;
        }

        /* 流光边框 */
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 13px;
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(212, 168, 67, 0.4),
                    rgba(74, 144, 226, 0.4),
                    rgba(138, 107, 176, 0.3),
                    rgba(106, 212, 224, 0.4),
                    rgba(212, 168, 67, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
        }
        @keyframes borderGlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 卡内光点装饰 */
        .card-accents {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .accent-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary-gold-light);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-gold), 0 0 20px var(--primary-gold);
            animation: accentFloat 3s ease-in-out infinite;
        }
        .accent-dot:nth-child(1) {
            top: 15px;
            left: 20px;
        }
        .accent-dot:nth-child(2) {
            top: 15px;
            right: 20px;
            animation-delay: 0.5s;
        }
        .accent-dot:nth-child(3) {
            bottom: 15px;
            left: 20px;
            animation-delay: 1s;
        }
        .accent-dot:nth-child(4) {
            bottom: 15px;
            right: 20px;
            animation-delay: 1.5s;
        }
        @keyframes accentFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* 图标区域 */
        .icon-area {
            margin-bottom: 18px;
            position: relative;
            display: inline-block;
            z-index: 2;
        }
        .icon-hex {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 40% 35%, rgba(240, 210, 128, 0.15) 0%, rgba(20, 22, 40, 0.8) 100%);
            border: 1.5px solid rgba(212, 168, 67, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.2);
            animation: iconFloat 4s ease-in-out infinite;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .icon-hex svg {
            width: 36px;
            height: 36px;
            fill: var(--primary-gold-light);
            filter: drop-shadow(0 0 8px rgba(240, 210, 128, 0.7));
        }

        /* 外环光晕 */
        .hex-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 92px;
            height: 92px;
            border: 1px solid rgba(212, 168, 67, 0.2);
            animation: ringRotate 20s linear infinite;
            pointer-events: none;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.1);
        }
        @keyframes ringRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #f0e6cc;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.5), 0 2px 4px rgba(0, 0, 0, 0.6);
            line-height: 1.3;
            z-index: 2;
            position: relative;
        }
        .title .highlight {
            background: linear-gradient(180deg, #ffe099 0%, #d4a843 50%, #b8832a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            font-weight: 300;
            z-index: 2;
            position: relative;
        }

        /* 检测标签 */
        .detection-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 20, 36, 0.8);
            border: 1px solid rgba(212, 168, 67, 0.3);
            padding: 8px 18px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 22px;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0% 50%);
            z-index: 2;
            position: relative;
        }
        .detection-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            box-shadow: 0 0 8px rgba(108, 199, 136, 0.7);
            animation: dotPulse 2s ease-in-out infinite;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(108, 199, 136, 0.5);
            }
            50% {
                box-shadow: 0 0 16px rgba(108, 199, 136, 0.9);
            }
        }
        .detection-badge .device-name {
            color: #e0d4b8;
            font-weight: 500;
        }

        /* 自动下载提示 */
        .auto-download-msg {
            margin: 0 auto 20px;
            padding: 10px 18px;
            background: rgba(14, 16, 28, 0.8);
            border-left: 3px solid var(--primary-gold);
            font-size: 0.9rem;
            color: #d8dce4;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.6s ease 0.2s both;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 6px 100%, 0% calc(100% - 6px));
            z-index: 2;
            position: relative;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .auto-download-msg .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(212, 168, 67, 0.3);
            border-top-color: var(--primary-gold-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 下载按钮 */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 380px;
            padding: 16px 32px;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: #0a0a1a;
            background: linear-gradient(160deg, #ffe099 0%, #d4a843 30%, #e0b860 60%, #b8832a 100%);
            border: none;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(212, 168, 67, 0.5), 0 0 40px rgba(212, 168, 67, 0.2);
            transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            z-index: 2;
            outline: none;
            clip-path: polygon(6px 0%, 100% 0%, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0% 100%, 0% 6px);
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(212, 168, 67, 0.8), 0 0 60px rgba(212, 168, 67, 0.4);
            background: linear-gradient(160deg, #ffeda0 0%, #e0b860 30%, #f0cc70 60%, #c09030 100%);
        }
        .btn-download:active {
            transform: translateY(0) scale(0.97);
            box-shadow: 0 2px 12px rgba(180, 130, 40, 0.7);
            transition: all 0.1s ease;
        }
        .btn-download::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-25deg);
            animation: btnShine 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes btnShine {
            0%,
            100% {
                left: -60%;
            }
            40% {
                left: 120%;
            }
            41% {
                left: -60%;
            }
        }
        .btn-download .btn-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .btn-download .btn-icon svg {
            width: 100%;
            height: 100%;
            fill: #2a1a08;
        }

        .btn-pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(212, 168, 67, 0.5);
            transform: translate(-50%, -50%);
            animation: pulseRing 2.5s ease-out infinite;
            pointer-events: none;
            z-index: 1;
            clip-path: polygon(6px 0%, 100% 0%, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0% 100%, 0% 6px);
        }
        @keyframes pulseRing {
            0% {
                width: 100%;
                height: 100%;
                opacity: 0.7;
                border-width: 2px;
            }
            100% {
                width: 130%;
                height: 150%;
                opacity: 0;
                border-width: 1px;
            }
        }

        /* 备选按钮 */
        .alt-downloads {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 2;
            position: relative;
        }
        .alt-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(20, 22, 36, 0.7);
            border: 1px solid rgba(120, 140, 180, 0.35);
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: all 0.3s ease;
            white-space: nowrap;
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0% 50%);
        }
        .alt-download-btn:hover {
            color: #e0e4f0;
            border-color: rgba(212, 168, 67, 0.6);
            background: rgba(30, 34, 48, 0.8);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.2);
        }
        .alt-download-btn.active-alt {
            color: #f0e6cc;
            border-color: rgba(212, 168, 67, 0.7);
            background: rgba(40, 42, 60, 0.85);
            box-shadow: 0 0 16px rgba(212, 168, 67, 0.3);
        }
        .alt-download-btn .alt-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            flex-shrink: 0;
        }
        .alt-download-btn.active-alt .alt-dot {
            background: var(--primary-gold-light);
            box-shadow: 0 0 8px rgba(240, 210, 128, 0.7);
        }

        .footer-note {
            margin-top: 22px;
            font-size: 0.75rem;
            color: rgba(140, 150, 170, 0.7);
            letter-spacing: 0.03em;
            line-height: 1.5;
            z-index: 2;
            position: relative;
        }
        .footer-note a {
            color: var(--primary-cyan);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-note a:hover {
            color: #80e0f0;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(14, 16, 28, 0.95);
            color: #e0e4f0;
            padding: 12px 24px;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            z-index: 100;
            border: 1px solid rgba(212, 168, 67, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            pointer-events: none;
            white-space: nowrap;
            clip-path: polygon(6px 0%, 100% 0%, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0% 100%, 0% 6px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 18px 26px;
            }
            .title {
                font-size: 1.5rem;
            }
            .subtitle {
                font-size: 0.8rem;
            }
            .btn-download {
                font-size: 1rem;
                padding: 14px 24px;
                max-width: 100%;
            }
            .icon-hex {
                width: 56px;
                height: 56px;
            }
            .icon-hex svg {
                width: 28px;
                height: 28px;
            }
            .hex-ring {
                width: 72px;
                height: 72px;
                top: -8px;
                left: -8px;
            }
            .alt-downloads {
                gap: 8px;
            }
            .alt-download-btn {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .detection-badge {
                font-size: 0.78rem;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="starfield" id="starfield"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 主容器 -->
    <div class="main-wrapper">
        <div class="card" id="card">
            <!-- 光点装饰 -->
            <div class="card-accents">
                <span class="accent-dot"></span>
                <span class="accent-dot"></span>
                <span class="accent-dot"></span>
                <span class="accent-dot"></span>
            </div>

            <!-- 图标 -->
            <div class="icon-area">
                <div class="hex-ring"></div>
                <div class="icon-hex">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L15 8L22 9L16.5 14L18 21L12 17L6 21L7.5 14L2 9L9 8L12 1Z" />
                    </svg>
                </div>
            </div>

            <h1 class="title">
                <span class="highlight">星穹铁道</span>
            </h1>
            <p class="subtitle">Honkai: Star Rail · 官方下载</p>

            <!-- 设备检测标签 -->
            <div class="detection-badge" id="detectionBadge">
                <span class="dot"></span>
                已识别为 <span class="device-name" id="deviceName">PC端</span>
            </div>

            <!-- 自动下载提示 -->
            <div class="auto-download-msg" id="autoDownloadMsg">
                <span class="spinner"></span>
                下载即将自动开始…
            </div>

            <!-- 主下载按钮 -->
            <div style="position:relative;display:inline-block;width:100%;max-width:380px;">
                <span class="btn-pulse-ring"></span>
                <a class="btn-download" id="btnMainDownload" href="#" rel="noopener">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </span>
                    <span id="btnMainText">下载 PC 版</span>
                </a>
            </div>

            <!-- 备选下载 -->
            <div class="alt-downloads">
                <button class="alt-download-btn" id="btnAltPC" onclick="switchToPC()">
                    <span class="alt-dot"></span> PC 版
                </button>
                <button class="alt-download-btn" id="btnAltAndroid" onclick="switchToAndroid()">
                    <span class="alt-dot"></span> Android 版
                </button>
                <button class="alt-download-btn" id="btnAltiOS" onclick="switchToiOS()">
                    <span class="alt-dot"></span> iOS 版
                </button>
            </div>

            <p class="footer-note">
                若下载未开始，请点击上方按钮<br>
                下载文件来源：<a href="https://sr.mihoyo.com/" target="_blank" rel="noopener">星穹铁道官方网站</a>
            </p>
        </div>
    </div>

    <script>
        (function() {
            // 下载链接配置
            const PC_DOWNLOAD_URL = 'https://act-api-takumi.mihoyo.com/event/download_porter/link/hkrpg_cn/official/pc_default';
            const ANDROID_DOWNLOAD_URL = 'https://act-api-takumi.mihoyo.com/event/download_porter/link/hkrpg_cn/official/android_default';
            const IOS_DOWNLOAD_URL = 'https://apps.apple.com/cn/app/%E5%B4%A9%E5%9D%8F-%E6%98%9F%E7%A9%B9%E9%93%81%E9%81%93/id1523037824';

            const btnMainDownload = document.getElementById('btnMainDownload');
            const btnMainText = document.getElementById('btnMainText');
            const deviceNameEl = document.getElementById('deviceName');
            const btnAltPC = document.getElementById('btnAltPC');
            const btnAltAndroid = document.getElementById('btnAltAndroid');
            const btnAltiOS = document.getElementById('btnAltiOS');
            const toast = document.getElementById('toast');
            const starfield = document.getElementById('starfield');
            const autoDownloadMsg = document.getElementById('autoDownloadMsg');

            let currentActive = 'pc'; // 'pc' | 'android' | 'ios'
            let autoDownloadTriggered = false;

            function detectDevice() {
                const ua = navigator.userAgent || '';
                const maxTouchPoints = navigator.maxTouchPoints || 0;

                // iOS
                if (/iPhone|iPod/.test(ua) || /iPad/.test(ua) || (/Macintosh/.test(ua) && maxTouchPoints > 2 && !/iPhone/.test(
                    ua))) {
                    return 'ios';
                }
                // Android
                if (/Android/.test(ua) || (/Linux/.test(ua) && /Mobile/.test(ua))) {
                    return 'android';
                }
                const mobileKeywords = ['BlackBerry', 'Windows Phone', 'webOS', 'Opera Mini', 'IEMobile'];
                if (mobileKeywords.some(keyword => ua.indexOf(keyword) !== -1)) {
                    return 'android';
                }
                return 'pc';
            }

            function getDeviceLabel(device) {
                if (device === 'ios') return 'iOS 设备';
                if (device === 'android') return 'Android 设备';
                const ua = navigator.userAgent || '';
                if (ua.indexOf('Mac') !== -1 && ua.indexOf('iPhone') === -1 && ua.indexOf('iPad') === -1) return 'macOS';
                if (ua.indexOf('Linux') !== -1 && ua.indexOf('Android') === -1) return 'Linux';
                return 'Windows';
            }

            function applyDevice(device) {
                currentActive = device;
                const deviceLabel = getDeviceLabel(device);
                deviceNameEl.textContent = deviceLabel;

                btnAltPC.classList.remove('active-alt');
                btnAltAndroid.classList.remove('active-alt');
                btnAltiOS.classList.remove('active-alt');

                if (device === 'pc') {
                    btnMainText.textContent = '下载 PC 版';
                    btnMainDownload.href = PC_DOWNLOAD_URL;
                    btnAltPC.classList.add('active-alt');
                } else if (device === 'android') {
                    btnMainText.textContent = '下载 Android 版';
                    btnMainDownload.href = ANDROID_DOWNLOAD_URL;
                    btnAltAndroid.classList.add('active-alt');
                } else if (device === 'ios') {
                    btnMainText.textContent = '下载 iOS 版';
                    btnMainDownload.href = IOS_DOWNLOAD_URL;
                    btnAltiOS.classList.add('active-alt');
                }
            }

            function triggerAutoDownload(device) {
                if (autoDownloadTriggered) return;
                autoDownloadTriggered = true;

                let url;
                if (device === 'pc') url = PC_DOWNLOAD_URL;
                else if (device === 'android') url = ANDROID_DOWNLOAD_URL;
                else url = IOS_DOWNLOAD_URL;

                const deviceName = getDeviceLabel(device);
                autoDownloadMsg.innerHTML = '<span class="spinner"></span> 正在为您启动 ' + deviceName + ' 下载…';
                showToast('下载即将开始，如未弹出请点击按钮');

                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    autoDownloadMsg.innerHTML = '✅ 下载已触发，如未开始请手动点击上方按钮';
                    autoDownloadMsg.style.borderLeftColor = 'var(--success)';
                }, 1500);
            }

            function switchToPC() {
                if (currentActive === 'pc') return;
                applyDevice('pc');
                showToast('已切换至 PC 版下载');
                animateCardPulse();
            }

            function switchToAndroid() {
                if (currentActive === 'android') return;
                applyDevice('android');
                showToast('已切换至 Android 版下载');
                animateCardPulse();
            }

            function switchToiOS() {
                if (currentActive === 'ios') return;
                applyDevice('ios');
                showToast('已切换至 iOS 版下载');
                animateCardPulse();
            }

            function animateCardPulse() {
                const card = document.getElementById('card');
                card.style.transition = 'box-shadow 0.4s ease';
                card.style.boxShadow = '0 8px 40px rgba(0,0,0,0.7), 0 0 100px rgba(212,168,67,0.3)';
                setTimeout(() => {
                    card.style.boxShadow = '0 8px 40px rgba(0,0,0,0.7), 0 0 80px rgba(74,144,226,0.15)';
                }, 400);
            }

            let toastTimer;
            function showToast(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            btnMainDownload.addEventListener('click', function(e) {
                const deviceName = currentActive === 'pc' ? 'PC版' : (currentActive === 'android' ? 'Android版' :
                    'iOS版');
                showToast('正在为您下载' + deviceName + '…');
            });

            // 星空生成
            function createStarfield() {
                const starCount = window.innerWidth < 480 ? 80 : 150;
                const fragment = document.createDocumentFragment();

                // 静止星星
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    const size = Math.random() * 2.5 + 0.6;
                    star.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        top: ${Math.random() * 100}%;
                        left: ${Math.random() * 100}%;
                        --dur: ${Math.random() * 4 + 3}s;
                        --delay: ${Math.random() * 6}s;
                        background: ${Math.random() < 0.2 ? '#ffe9a0' : Math.random() < 0.4 ? '#a0d0ff' : '#ffffff'};
                    `;
                    fragment.appendChild(star);
                }

                // 星轨线条
                for (let i = 0; i < 6; i++) {
                    const trail = document.createElement('div');
                    trail.classList.add('star-trail');
                    const topPos = Math.random() * 90 + 5;
                    trail.style.cssText = `
                        top: ${topPos}%;
                        left: 0;
                        width: ${Math.random() * 120 + 80}px;
                        --trail-dur: ${Math.random() * 8 + 10}s;
                        --trail-delay: ${Math.random() * 10}s;
                    `;
                    fragment.appendChild(trail);
                }
                starfield.appendChild(fragment);
            }

            function init() {
                const detectedDevice = detectDevice();
                applyDevice(detectedDevice);
                createStarfield();
                triggerAutoDownload(detectedDevice);
            }

            window.switchToPC = switchToPC;
            window.switchToAndroid = switchToAndroid;
            window.switchToiOS = switchToiOS;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            let resizeDebounce;
            window.addEventListener('resize', () => {
                clearTimeout(resizeDebounce);
                resizeDebounce = setTimeout(() => {
                    starfield.innerHTML = '';
                    createStarfield();
                }, 400);
            });
        })();
    </script>
</body>
</html>

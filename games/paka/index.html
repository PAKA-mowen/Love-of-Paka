            { id: 49, question: "我的老婆是", correct: "小鸟游六花", wrongs: ["甲", "乙", "丙", "丁"] },
            { id: 50, question: "吃辣", correct: "之后喝奶制品", wrongs: ["的时候喝冰水", "的时候喝热水", "之前吃水果", "我不吃辣椒"] }
        ];

        // ---------- 工具函数 ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateShuffledOptions(questionObj) {
            let allOpts = [questionObj.correct, ...questionObj.wrongs];
            return shuffleArray([...allOpts]);
        }

        // 验证从 JSON 加载的题目结构
        function validateQuestions(arr) {
            if (!Array.isArray(arr)) return false;
            if (arr.length === 0) return false;
            for (let q of arr) {
                if (typeof q.id !== 'number' || !q.question || !q.correct || !Array.isArray(q.wrongs) || q.wrongs.length < 1) {
                    return false;
                }
            }
            return true;
        }

        function initShuffledQuestions(sourceQuestions) {
            let cloned = sourceQuestions.map(q => ({
                id: q.id,
                question: q.question,
                correct: q.correct,
                wrongs: [...q.wrongs]
            }));
            let shuffledQ = shuffleArray([...cloned]);
            shuffledQ = shuffledQ.map(q => ({
                ...q,
                shuffledOptions: generateShuffledOptions(q)
            }));
            return shuffledQ;
        }

        function persistAnswers() {
            localStorage.setItem('alpaca_quiz_answers', JSON.stringify(userAnswers));
        }

        function resetAndReloadState(resetUserAnswers = false) {
            if (resetUserAnswers) {
                userAnswers = {};
                localStorage.removeItem('alpaca_quiz_answers');
            } else {
                const stored = localStorage.getItem('alpaca_quiz_answers');
                if (stored) {
                    try {
                        userAnswers = JSON.parse(stored);
                    } catch (e) { userAnswers = {}; }
                } else {
                    userAnswers = {};
                }
            }
            shuffledQuestions = initShuffledQuestions(RAW_QUESTIONS);
            currentPage = 0;
            totalPages = Math.ceil(shuffledQuestions.length / PAGE_SIZE);
            renderCurrentPage();
            updateStatsAndUI();
        }

        function updateAnswer(questionId, selectedText) {
            if (!selectedText || selectedText.trim() === "") return;
            userAnswers[questionId] = selectedText;
            persistAnswers();
            updateStatsAndUI();
        }

        function getCurrentPageQuestions() {
            const start = currentPage * PAGE_SIZE;
            return shuffledQuestions.slice(start, start + PAGE_SIZE);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderCurrentPage() {
            const container = document.getElementById('questionsContainer');
            if (!container) return;
            const pageQuestions = getCurrentPageQuestions();
            if (!pageQuestions.length && shuffledQuestions.length) {
                if (currentPage >= totalPages) currentPage = totalPages - 1;
                return renderCurrentPage();
            }

            let html = '';
            pageQuestions.forEach((q, idx) => {
                const globalIndex = currentPage * PAGE_SIZE + idx + 1;
                const selectedVal = userAnswers[q.id] || '';
                const options = q.shuffledOptions;
                let optionsHtml = '';
                options.forEach(opt => {
                    const checkedAttr = (selectedVal === opt) ? 'checked' : '';
                    const safeOpt = escapeHtml(opt);
                    const radioId = `q_${q.id}_${safeOpt.replace(/\s/g, '')}_${Math.random().toString(36).slice(2, 8)}`;
                    optionsHtml += `
                        <div class="option">
                            <input type="radio" name="q_${q.id}" value="${safeOpt}" id="${radioId}" ${checkedAttr}>
                            <label for="${radioId}">${safeOpt}</label>
                        </div>
                    `;
                });
                html += `
                    <div class="question-card" data-qid="${q.id}">
                        <div class="question-text">
                            <span class="q-num">${globalIndex}</span>
                            <span>${escapeHtml(q.question)}</span>
                        </div>
                        <div class="options">${optionsHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        const nameAttr = e.target.getAttribute('name');
                        const questionId = parseInt(nameAttr.split('_')[1]);
                        updateAnswer(questionId, e.target.value);
                    }
                });
            });
        }

        function updateStatsAndUI() {
            const total = shuffledQuestions.length;
            let answeredCount = 0;
            for (let q of shuffledQuestions) {
                if (userAnswers[q.id]) answeredCount++;
            }
            const answeredSpan = document.getElementById('answeredCountDisplay');
            if (answeredSpan) answeredSpan.innerText = `📋 已答 ${answeredCount} / ${total} 题`;
            const scoreSpan = document.getElementById('tempScoreDisplay');
            if (scoreSpan) scoreSpan.innerHTML = `⭐ 已选 ${answeredCount} 题 · 待揭晓`;
            const pageIndicator = document.getElementById('pageIndicator');
            if (pageIndicator) pageIndicator.innerText = `第 ${currentPage + 1} / ${totalPages} 页`;
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (prevBtn) prevBtn.disabled = (currentPage === 0);
            if (nextBtn) nextBtn.disabled = (currentPage === totalPages - 1);
        }

        function goToPage(page) {
            if (page < 0) page = 0;
            if (page >= totalPages) page = totalPages - 1;
            if (page === currentPage) return;
            currentPage = page;
            renderCurrentPage();
            updateStatsAndUI();
            window.scrollTo({ top: 180, behavior: 'smooth' });
        }

        function getScoreReport(score) {
            if (score === 0) {
                return { level: "💀 虚空羊驼 · 反向圣者", emoji: "🌀💀", desc: "0分？！你完美躲过了所有正确答案，这种操作堪称玄学黑洞。建议购买彩票前先找羊驼开光。" };
            }
            if (score === 100) {
                return { level: "🏆 羊驼之魂 · 完全一致体", emoji: "🦙✨🏆", desc: "满分！你就是行走的「墨问羊驼」百科全书，本尊见了都要递奶茶。请收下这份云端认证！" };
            }
            const tier = Math.ceil(score / 10);
            const tiersMap = {
                1: { level: "🌱 萌芽羊驼 · 刚睡醒", emoji: "🌱🦙", desc: "对羊驼的了解还在襁褓中，再补补课，下次争取脱离地面~" },
                2: { level: "📖 学徒羊驼 · 略懂墨汁", emoji: "📖🐫", desc: "略懂皮毛，方向对了但没完全对，继续翻翻羊驼秘籍吧！" },
                3: { level: "🔍 观察者羊驼 · 暗中窥探", emoji: "👀🦙", desc: "你开始触及羊驼宇宙的冰山一角，保持好奇，答案在风中飘。" },
                4: { level: "🤔 哲思羊驼 · 半梦半醒", emoji: "🤔💭", desc: "理性与直觉交织，你逐渐领悟墨问的真意，就差一阵风。" },
                5: { level: "📝 墨问学徒 · 执笔羊驼", emoji: "✍️🦙", desc: "笔尖沙沙作响，你答对了一半，羊驼星人向你投来赞许的目光。" },
                6: { level: "🦙 标准羊驼 · 社区熟脸", emoji: "🦙⭐", desc: "合格羊驼成员，聚会时能一起吐槽菠萝包和法老，融入感+1" },
                7: { level: "🎓 资深羊驼 · 绒毛带光", emoji: "🎓✨", desc: "资深身份已经藏不住了，关于羊驼的冷热知识你都拿捏。" },
                8: { level: "⚡ 灵光羊驼 · 脑电波同步", emoji: "⚡🧠", desc: "高维链接达成！你的选择与羊驼本心高度重合，就差一点共鸣。" },
                9: { level: "🧠 半仙羊驼 · 云端漫步", emoji: "☁️🦙", desc: "差几步满分，你几乎听见了羊驼在耳边的低语，继续修行！" },
                10: { level: "✨ 准神羊驼 · 半步真我", emoji: "🌟🔮", desc: "91-99分！离完全体只差一层窗户纸，再踩一次蟑螂或许就顿悟了。" }
            };
            const info = tiersMap[tier] || tiersMap[5];
            return { level: info.level, emoji: info.emoji, desc: info.desc };
        }

        function computeAndShowReport() {
            let totalScore = 0;
            for (let q of shuffledQuestions) {
                if (userAnswers[q.id] && userAnswers[q.id] === q.correct) totalScore += 2;
            }
            latestScore = totalScore;
            const report = getScoreReport(totalScore);
            document.getElementById('reportEmoji').innerHTML = report.emoji;
            document.getElementById('reportScore').innerHTML = `${totalScore} 分`;
            document.getElementById('reportLevel').innerHTML = report.level;
            document.getElementById('reportDesc').innerHTML = report.desc;
            document.getElementById('reportModal').classList.add('active');
            document.getElementById('tempScoreDisplay').innerHTML = `🎯 最终得分: ${totalScore} · 报告已出`;
            showToast(`✨ 得分：${totalScore} 分，打开羊驼报告卷轴 ✨`, 2000);
        }

        async function downloadReportAsPDF() {
            if (latestScore === null) {
                showToast("请先提交问卷，生成报告后再下载PDF~", 2000);
                return;
            }
            const element = document.getElementById('reportCardForPdf');
            if (!element) {
                showToast("报告区域加载出错", 1500);
                return;
            }
            showToast("📄 正在生成PDF报告，请稍候...", 1800);
            try {
                const originalOverflow = element.style.overflow;
                element.style.overflow = 'visible';
                const canvas = await html2canvas(element, {
                    scale: 2.5,
                    backgroundColor: '#FFF9F2',
                    logging: false,
                    useCORS: false
                });
                element.style.overflow = originalOverflow;
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const imgWidth = 210;
                const pageHeight = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                if (imgHeight > pageHeight) {
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                }
                pdf.save(`羊驼成绩报告_${latestScore}分.pdf`);
                showToast("✅ PDF报告已下载", 2000);
            } catch (err) {
                console.error(err);
                showToast("生成失败，可尝试刷新页面后重试", 2000);
            }
        }

        function showToast(msg, duration = 2500) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, duration);
        }

        function resetFullQuiz() {
            if (confirm('⚠️ 重置将清空所有已选答案，并且题目顺序/选项顺序会重新随机。确定重置吗？')) {
                localStorage.removeItem('alpaca_quiz_answers');
                userAnswers = {};
                latestScore = null;
                shuffledQuestions = initShuffledQuestions(RAW_QUESTIONS);
                currentPage = 0;
                totalPages = Math.ceil(shuffledQuestions.length / PAGE_SIZE);
                renderCurrentPage();
                updateStatsAndUI();
                showToast('已重置，题目&选项已刷新，答案已清空', 1800);
                document.getElementById('tempScoreDisplay').innerHTML = `⭐ 已选 0 题 · 待揭晓`;
                document.getElementById('reportModal').classList.remove('active');
            }
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('active');
        }

        // ---------- 初始化：加载 JSON 并启动 ----------
        async function loadQuestionsAndInit() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) throw new Error('Failed to fetch JSON');
                const jsonData = await response.json();
                if (validateQuestions(jsonData)) {
                    RAW_QUESTIONS = jsonData;
                    console.log('✅ 成功从 questions.json 加载题目，共', RAW_QUESTIONS.length, '题');
                } else {
                    throw new Error('JSON 结构校验失败');
                }
            } catch (error) {
                console.warn('⚠️ 无法从 questions.json 加载，使用内置硬编码题库作为后备:', error.message);
                RAW_QUESTIONS = FALLBACK_QUESTIONS;
                showToast('题库加载失败，已使用内置备用题库', 2000);
            }
            // 继续初始化
            const storedAnswers = localStorage.getItem('alpaca_quiz_answers');
            if (storedAnswers) {
                try {
                    userAnswers = JSON.parse(storedAnswers);
                } catch (e) { userAnswers = {}; }
            } else {
                userAnswers = {};
            }
            shuffledQuestions = initShuffledQuestions(RAW_QUESTIONS);
            totalPages = Math.ceil(shuffledQuestions.length / PAGE_SIZE);
            currentPage = 0;
            renderCurrentPage();
            updateStatsAndUI();
        }

        // 绑定事件并启动
        function init() {
            document.getElementById('prevPageBtn').addEventListener('click', () => goToPage(currentPage - 1));
            document.getElementById('nextPageBtn').addEventListener('click', () => goToPage(currentPage + 1));
            document.getElementById('submitQuizBtn').addEventListener('click', computeAndShowReport);
            document.getElementById('resetQuizBtn').addEventListener('click', resetFullQuiz);
            document.getElementById('closeReportBtn').addEventListener('click', closeReportModal);
            document.getElementById('downloadPdfBtn').addEventListener('click', downloadReportAsPDF);
            document.getElementById('reportModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('reportModal')) closeReportModal();
            });
            loadQuestionsAndInit();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>

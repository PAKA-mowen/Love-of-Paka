<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>五子棋 </title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #2a5f4b 0%, #1d3e31 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #deb887;
            background-image: radial-gradient(circle at 25% 40%, rgba(210, 150, 75, 0.3) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255, 255, 255, 0.6);
            padding: 20px 20px 18px 20px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            background-color: #f7e9c3;
            transition: filter 0.1s;
        }

        canvas:active {
            cursor: grabbing;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status {
            background: #2c2c2c;
            padding: 8px 20px;
            border-radius: 60px;
            color: #f3e3c2;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: inset 0 1px 3px #00000055, 0 2px 3px rgba(255,255,200,0.3);
            min-width: 160px;
            text-align: center;
            backdrop-filter: blur(2px);
        }

        button {
            background: #3c2e24;
            border: none;
            color: #f7e9c3;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e1610;
            transition: 0.07s linear;
            font-family: inherit;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e1610;
        }

        .difficulty {
            background: #4d3b2c;
            display: flex;
            gap: 10px;
            padding: 6px 16px;
            border-radius: 60px;
            align-items: center;
        }

        .difficulty span {
            font-weight: bold;
            color: #ffefcf;
        }

        select {
            background: #f7e9c3;
            border: none;
            border-radius: 32px;
            padding: 6px 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 16px;
            color: #2c2c1c;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gobangCanvas" width="560" height="560"></canvas>
        <div class="info-panel">
            <div class="status" id="gameStatus"> AI 先手 · 黑棋</div>
            <div class="difficulty">
                <span> AI难度</span>
                <select id="difficultySelect">
                    <option value="2">简单</option>
                    <option value="3" selected> 中等 </option>
                    <option value="4"> 困难 </option>
                </select>
            </div>
            <button id="restartBtn"> 新一局</button>
        </div>
        <footer>⚫ AI(黑) · ⚪ 玩家(白) | 点击棋盘交叉点落子 |</footer>
    </div>
</div>

<script>
    // ======================== 全局常量 & 棋型定义 ========================
    const BOARD_SIZE = 15;        // 15x15 标准五子棋棋盘
    const EMPTY = 0;
    const AI_PIECE = 1;    // 黑棋 (AI)
    const HUMAN_PIECE = -1; // 白棋 (玩家)

    // 棋型打分权重 (基于原项目评分体系)
    const SCORES = {
        FIVE:      10000000,   // 连五
        FOUR:      100000,     // 活四
        BLOCKED_FOUR: 5000,    // 冲四 (眠四)
        THREE:      2500,      // 活三
        SLEEP_THREE: 400,      // 眠三
        TWO:        200,       // 活二
        SLEEP_TWO:   30,       // 眠二
        ONE:         5
    };

    // 方向向量 (水平, 垂直, 主对角线, 次对角线)
    const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

    // ======================== 棋盘核心 + 胜负判断 ========================
    class GobangBoard {
        constructor(size = BOARD_SIZE) {
            this.size = size;
            this.grid = Array(size).fill().map(() => Array(size).fill(EMPTY));
            this.history = [];   // 存储落子记录 [x,y,role]
        }

        // 落子
        put(x, y, role) {
            if (x < 0 || x >= this.size || y < 0 || y >= this.size) return false;
            if (this.grid[x][y] !== EMPTY) return false;
            this.grid[x][y] = role;
            this.history.push({x, y, role});
            return true;
        }

        // 悔棋 (AI模拟用)
        undo() {
            if (this.history.length === 0) return false;
            const last = this.history.pop();
            this.grid[last.x][last.y] = EMPTY;
            return true;
        }

        // 获取指定位置棋子
        getPiece(x, y) {
            if (x < 0 || x >= this.size || y < 0 || y >= this.size) return null;
            return this.grid[x][y];
        }

        // 复制棋盘 (用于递归搜索时暂存，但我们会使用undo，此方法备用)
        clone() {
            const newBoard = new GobangBoard(this.size);
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    newBoard.grid[i][j] = this.grid[i][j];
                }
            }
            newBoard.history = [...this.history];
            return newBoard;
        }

        // 检查是否平局 (满盘)
        isDraw() {
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] === EMPTY) return false;
                }
            }
            return true;
        }

        // 检查当前棋盘胜者 (基于最后一次落子快速判断效率更高，但这里为了通用，全局判断)
        // 针对某角色是否胜利，但通常我们根据最后落子检查周围
        checkWinnerOnPiece(x, y, role) {
            if (this.grid[x][y] !== role) return false;
            for (let [dx, dy] of DIRS) {
                let count = 1;
                // 正方向延伸
                for (let step = 1; step <= 5; step++) {
                    const nx = x + dx * step, ny = y + dy * step;
                    if (nx < 0 || ny < 0 || nx >= this.size || ny >= this.size) break;
                    if (this.grid[nx][ny] === role) count++;
                    else break;
                }
                // 反方向延伸
                for (let step = 1; step <= 5; step++) {
                    const nx = x - dx * step, ny = y - dy * step;
                    if (nx < 0 || ny < 0 || nx >= this.size || ny >= this.size) break;
                    if (this.grid[nx][ny] === role) count++;
                    else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // 获取全局胜者 (用于终局判断)
        getWinner() {
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    const p = this.grid[i][j];
                    if (p !== EMPTY && this.checkWinnerOnPiece(i, j, p)) {
                        return p;
                    }
                }
            }
            return null;
        }

        // 游戏是否结束 (有胜者或平局)
        isGameOver() {
            return this.getWinner() !== null || this.isDraw();
        }

        // ---------- 辅助: 获取所有空位 (候选落子列表, 启发式优化: 只考虑附近有棋子的位置, 提高效率) ----------
        getValuableMoves(role = AI_PIECE, radius = 2) {
            let moves = [];
            // 如果棋盘为空，返回中心点附近 (天元)
            let hasPiece = false;
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] !== EMPTY) {
                        hasPiece = true;
                        break;
                    }
                }
            }
            if (!hasPiece) {
                const center = Math.floor(this.size / 2);
                return [[center, center]];
            }

            // 收集所有非空位置周围 radius 内的空白点
            const considered = Array(this.size).fill().map(() => Array(this.size).fill(false));
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] !== EMPTY) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            for (let dy = -radius; dy <= radius; dy++) {
                                const nx = i + dx, ny = j + dy;
                                if (nx >= 0 && ny >= 0 && nx < this.size && ny < this.size && this.grid[nx][ny] === EMPTY && !considered[nx][ny]) {
                                    considered[nx][ny] = true;
                                    moves.push([nx, ny]);
                                }
                            }
                        }
                    }
                }
            }
            if (moves.length === 0) {
                // 全盘扫描空白
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.grid[i][j] === EMPTY) moves.push([i, j]);
                    }
                }
            }
            // 根据简单位置分数初步排序 (快速启发)
            moves.sort((a, b) => {
                const scoreA = this.evaluatePosition(a[0], a[1], role);
                const scoreB = this.evaluatePosition(b[0], b[1], role);
                return scoreB - scoreA;
            });
            // 限制数量保证搜索性能
            return moves.slice(0, 24);
        }

        // 针对某个空位评估分数 (对某方角色来说这个点的价值)
        evaluatePosition(x, y, role) {
            let totalScore = 0;
            for (let dir of DIRS) {
                totalScore += this.evaluateDirection(x, y, role, dir);
            }
            return totalScore;
        }

        // 计算某个方向上的棋型分数 (经典模式匹配)
        evaluateDirection(x, y, role, [dx, dy]) {
            let line = [];
            // 向正方向收集最多6个棋子
            for (let step = -5; step <= 5; step++) {
                const nx = x + dx * step, ny = y + dy * step;
                if (nx < 0 || ny < 0 || nx >= this.size || ny >= this.size) {
                    line.push(0);   // 边界视为阻挡
                    continue;
                }
                const piece = this.grid[nx][ny];
                if (piece === role) line.push(1);
                else if (piece === -role) line.push(2);  // 对方棋子作为阻挡
                else line.push(0);
            }
            // 将line数组转为字符串模式进行匹配
            const str = line.join('');
            // 匹配连五: 11111
            if (/1{5,}/.test(str)) return SCORES.FIVE;
            // 活四: 011110
            if (/011110/.test(str)) return SCORES.FOUR;
            // 冲四: 11110|01111| 211110 等形式
            let fourCount = 0;
            if (/11110/.test(str) || /01111/.test(str) || /211110/.test(str) || /111120/.test(str)) fourCount = 1;
            // 双冲四等简化，直接加分
            if (fourCount) return SCORES.BLOCKED_FOUR;
            // 活三: 01110
            if (/01110/.test(str)) return SCORES.THREE;
            // 眠三模式: 各种 21110, 201110, 010110 等简化处理
            if (/01110/.test(str)) return SCORES.THREE;
            if (/1110/.test(str) && !/11110/.test(str)) return SCORES.SLEEP_THREE;
            if (/0111/.test(str) && !/01111/.test(str)) return SCORES.SLEEP_THREE;
            if (/21110/.test(str)) return SCORES.SLEEP_THREE;
            if (/010110/.test(str) || /011010/.test(str)) return SCORES.SLEEP_THREE;
            // 活二: 001100 或者 0110
            if (/0110/.test(str) || /001100/.test(str)) return SCORES.TWO;
            if (/01010/.test(str)) return SCORES.TWO;
            // 眠二弱分
            if (/00120/.test(str)) return SCORES.SLEEP_TWO;
            return 0;
        }

        // 整体棋盘评估函数 (用于AI局势评价, 返回当前角色优势分)
        evaluate(role) {
            // role是当前调用者视角 (AI最大化)
            let totalScore = 0;
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] === role) {
                        totalScore += this.evaluatePosition(i, j, role);
                    } else if (this.grid[i][j] === -role) {
                        totalScore -= this.evaluatePosition(i, j, -role);
                    }
                }
            }
            return totalScore;
        }
    }

    // ======================== AI 决策引擎 (Alpha-Beta 剪枝 + 迭代加深) ========================
    class AIEngine {
        constructor(board, maxDepth = 3) {
            this.board = board;
            this.maxDepth = maxDepth;
            this.nodes = 0;
        }

        setDepth(depth) {
            this.maxDepth = depth;
        }

        // 主入口: 获取最佳落子点 (同步，但通过setTimeout避免长时间阻塞界面)
        getBestMove(role, callback) {
            // 异步处理保证UI流畅
            setTimeout(() => {
                const start = performance.now();
                this.nodes = 0;
                const best = this.alphaBeta(role, this.maxDepth, -Infinity, Infinity, true);
                const elapsed = performance.now() - start;
                console.log(`AI思考深度:${this.maxDepth} 节点:${this.nodes} 耗时:${elapsed.toFixed(1)}ms`);
                callback(best && best.move ? best.move : null);
            }, 20);
        }

        // Alpha-Beta 核心
        alphaBeta(role, depth, alpha, beta, isMaximizingPlayer) {
            this.nodes++;
            const board = this.board;
            const gameWinner = board.getWinner();
            if (gameWinner === role) return { score: 1000000 + depth };
            if (gameWinner === -role) return { score: -1000000 - depth };
            if (depth === 0 || board.isDraw()) {
                return { score: board.evaluate(role) };
            }

            let moves;
            if (isMaximizingPlayer) {
                moves = board.getValuableMoves(role);
                let bestMove = null;
                let maxEval = -Infinity;
                for (let move of moves) {
                    const [x, y] = move;
                    board.put(x, y, role);
                    const evaluation = this.alphaBeta(role, depth - 1, alpha, beta, false);
                    board.undo();
                    if (evaluation.score > maxEval) {
                        maxEval = evaluation.score;
                        bestMove = move;
                    }
                    alpha = Math.max(alpha, evaluation.score);
                    if (beta <= alpha) break; // Beta 剪枝
                }
                return { score: maxEval, move: bestMove };
            } else {
                // 极小化层 (对手)
                moves = board.getValuableMoves(-role);
                let bestMove = null;
                let minEval = Infinity;
                for (let move of moves) {
                    const [x, y] = move;
                    board.put(x, y, -role);
                    const evaluation = this.alphaBeta(role, depth - 1, alpha, beta, true);
                    board.undo();
                    if (evaluation.score < minEval) {
                        minEval = evaluation.score;
                        bestMove = move;
                    }
                    beta = Math.min(beta, evaluation.score);
                    if (beta <= alpha) break;
                }
                return { score: minEval, move: bestMove };
            }
        }
    }

    // ======================== UI 绘制及交互 ========================
    class GobangGame {
        constructor(canvasId, boardSize = 15) {
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            this.boardSize = boardSize;
            this.cellSize = this.canvas.width / boardSize;
            this.board = new GobangBoard(boardSize);
            this.aiEngine = new AIEngine(this.board, 3); // 默认深度3
            this.currentTurn = AI_PIECE;   // AI先手 (黑棋)
            this.gameOver = false;
            this.winner = null;
            this.initEvents();
            this.drawBoard();
            // 如果AI先手，立刻走一步
            if (this.currentTurn === AI_PIECE && !this.gameOver) {
                this.aiMove();
            }
            this.updateStatusText();
        }

        // 精确获取鼠标点击的交叉点 (行, 列)
        getClosestIntersection(clientX, clientY) {
            const rect = this.canvas.getBoundingClientRect();
            const scaleX = this.canvas.width / rect.width;
            const scaleY = this.canvas.height / rect.height;
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            
            let minDist = this.cellSize * 0.4;  // 有效点击半径 (小于此值才算命中)
            let bestRow = -1, bestCol = -1;
            
            // 遍历所有交叉点，找到最近的一个
            for (let i = 0; i < this.boardSize; i++) {
                for (let j = 0; j < this.boardSize; j++) {
                    const cx = j * this.cellSize + this.cellSize / 2;
                    const cy = i * this.cellSize + this.cellSize / 2;
                    const dx = canvasX - cx;
                    const dy = canvasY - cy;
                    const dist = Math.hypot(dx, dy);
                    if (dist < minDist) {
                        minDist = dist;
                        bestRow = i;
                        bestCol = j;
                    }
                }
            }
            if (bestRow !== -1 && bestCol !== -1) {
                return { row: bestRow, col: bestCol };
            }
            return null;
        }

        initEvents() {
            this.canvas.addEventListener('click', (e) => {
                if (this.gameOver) return;
                if (this.currentTurn !== HUMAN_PIECE) return;
                
                const intersection = this.getClosestIntersection(e.clientX, e.clientY);
                if (!intersection) return; // 点击偏离交叉点太远，忽略
                
                const { row, col } = intersection;
                if (this.board.getPiece(row, col) === EMPTY) {
                    this.humanMove(row, col);
                }
            });
            
            document.getElementById('restartBtn').addEventListener('click', () => this.restart());
            const selectEl = document.getElementById('difficultySelect');
            selectEl.addEventListener('change', (e) => {
                const depth = parseInt(e.target.value);
                this.aiEngine.setDepth(depth);
            });
        }

        humanMove(x, y) {
            if (this.board.put(x, y, HUMAN_PIECE)) {
                this.drawPiece(x, y, HUMAN_PIECE);
                // 检查胜负
                if (this.board.checkWinnerOnPiece(x, y, HUMAN_PIECE)) {
                    this.gameOver = true;
                    this.winner = HUMAN_PIECE;
                    this.updateStatusText();
                    this.drawBoard();
                    return;
                }
                if (this.board.isDraw()) {
                    this.gameOver = true;
                    this.winner = null;
                    this.updateStatusText();
                    this.drawBoard();
                    return;
                }
                this.currentTurn = AI_PIECE;
                this.updateStatusText();
                this.drawBoard();
                // AI 响应
                this.aiMove();
            }
        }

        aiMove() {
            if (this.gameOver) return;
            if (this.currentTurn !== AI_PIECE) return;
            this.updateStatusText(" AI 思考中 ...");
            this.aiEngine.getBestMove(AI_PIECE, (move) => {
                if (this.gameOver) return;
                if (this.currentTurn !== AI_PIECE) return;
                if (move) {
                    const [x, y] = move;
                    if (this.board.put(x, y, AI_PIECE)) {
                        this.drawPiece(x, y, AI_PIECE);
                        if (this.board.checkWinnerOnPiece(x, y, AI_PIECE)) {
                            this.gameOver = true;
                            this.winner = AI_PIECE;
                            this.updateStatusText();
                            this.drawBoard();
                            return;
                        }
                        if (this.board.isDraw()) {
                            this.gameOver = true;
                            this.winner = null;
                            this.updateStatusText();
                            this.drawBoard();
                            return;
                        }
                        this.currentTurn = HUMAN_PIECE;
                        this.updateStatusText();
                        this.drawBoard();
                    } else {
                        // 无效落子极小概率，直接切换回玩家
                        this.currentTurn = HUMAN_PIECE;
                        this.updateStatusText();
                        this.drawBoard();
                    }
                } else {
                    // 没有合法位置可能是平局
                    if (this.board.isDraw()) {
                        this.gameOver = true;
                        this.updateStatusText();
                    } else {
                        this.currentTurn = HUMAN_PIECE;
                        this.updateStatusText();
                    }
                    this.drawBoard();
                }
            });
        }

        drawBoard() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            // 绘制网格线
            this.ctx.beginPath();
            this.ctx.strokeStyle = '#5a3e2b';
            this.ctx.lineWidth = 1.8;
            for (let i = 0; i < this.boardSize; i++) {
                const pos = i * this.cellSize;
                this.ctx.moveTo(this.cellSize / 2, pos + this.cellSize / 2);
                this.ctx.lineTo(this.canvas.width - this.cellSize / 2, pos + this.cellSize / 2);
                this.ctx.stroke();
                this.ctx.moveTo(pos + this.cellSize / 2, this.cellSize / 2);
                this.ctx.lineTo(pos + this.cellSize / 2, this.canvas.height - this.cellSize / 2);
                this.ctx.stroke();
            }
            // 画星位 (天元/小目)
            const starPos = [[3,3],[11,3],[7,7],[3,11],[11,11]];
            for (let [x,y] of starPos) {
                this.ctx.beginPath();
                this.ctx.fillStyle = '#b87c4f';
                this.ctx.arc(x * this.cellSize + this.cellSize/2, y * this.cellSize + this.cellSize/2, this.cellSize*0.12, 0, 2*Math.PI);
                this.ctx.fill();
                this.ctx.fillStyle = '#e9c891';
                this.ctx.arc(x * this.cellSize + this.cellSize/2, y * this.cellSize + this.cellSize/2, this.cellSize*0.07, 0, 2*Math.PI);
                this.ctx.fill();
            }

            // 绘制棋子
            for (let i = 0; i < this.boardSize; i++) {
                for (let j = 0; j < this.boardSize; j++) {
                    const piece = this.board.getPiece(i, j);
                    if (piece !== EMPTY) {
                        this.drawPiece(i, j, piece);
                    }
                }
            }

            // 游戏结束遮罩
            if (this.gameOver) {
                this.ctx.fillStyle = 'rgba(0,0,0,0.6)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.font = `bold ${this.cellSize * 0.8}px "Segoe UI"`;
                this.ctx.fillStyle = '#f7e9c3';
                this.ctx.shadowBlur = 0;
                let msg = this.winner === AI_PIECE ? ' AI 胜利！' : (this.winner === HUMAN_PIECE ? ' 玩家胜利！' : ' 平局');
                this.ctx.fillText(msg, this.canvas.width/2 - this.ctx.measureText(msg).width/2, this.canvas.height/2);
            }
        }

        drawPiece(x, y, role) {
            const cx = y * this.cellSize + this.cellSize/2;
            const cy = x * this.cellSize + this.cellSize/2;
            const radius = this.cellSize * 0.4;
            const grad = this.ctx.createRadialGradient(cx - radius*0.25, cy - radius*0.25, radius*0.2, cx, cy, radius);
            if (role === AI_PIECE) {
                grad.addColorStop(0, '#2b2b2b');
                grad.addColorStop(1, '#111111');
                this.ctx.fillStyle = grad;
            } else {
                grad.addColorStop(0, '#f9f9fc');
                grad.addColorStop(1, '#d0cfcf');
                this.ctx.fillStyle = grad;
            }
            this.ctx.beginPath();
            this.ctx.arc(cx, cy, radius-1, 0, 2*Math.PI);
            this.ctx.fill();
            this.ctx.strokeStyle = '#5a4c3c';
            this.ctx.lineWidth = 1;
            this.ctx.stroke();
            if (role === AI_PIECE) {
                this.ctx.fillStyle = '#aaa';
                this.ctx.font = `${Math.floor(radius)}px "Segoe UI"`;
            } else {
                this.ctx.fillStyle = '#6d5c47';
            }
        }

        updateStatusText(customMsg = null) {
            const statusDiv = document.getElementById('gameStatus');
            if (this.gameOver) {
                if (this.winner === AI_PIECE) statusDiv.innerText = ' AI 获胜!';
                else if (this.winner === HUMAN_PIECE) statusDiv.innerText = ' 你赢了! 太强了!';
                else statusDiv.innerText = ' 平局';
                return;
            }
            if (customMsg) {
                statusDiv.innerText = customMsg;
                return;
            }
            if (this.currentTurn === AI_PIECE) statusDiv.innerText = ' AI 思考 ...';
            else statusDiv.innerText = ' 轮到你了 · 白棋';
        }

        restart() {
            this.board = new GobangBoard(this.boardSize);
            this.aiEngine.board = this.board;
            this.gameOver = false;
            this.winner = null;
            // AI 先手 (黑棋)
            this.currentTurn = AI_PIECE;
            this.drawBoard();
            this.updateStatusText();
            if (this.currentTurn === AI_PIECE) {
                this.aiMove();
            }
        }
    }

    // 启动游戏
    window.addEventListener('load', () => {
        window.game = new GobangGame('gobangCanvas', BOARD_SIZE);
    });
</script>

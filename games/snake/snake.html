<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>灵动贪吃蛇·完全体 | 双模式 + 自定义</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'SF Pro Text', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* 主容器 */
        .game-container {
            background: rgba(10, 25, 15, 0.7);
            backdrop-filter: blur(3px);
            border-radius: 56px;
            padding: 20px 24px 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            max-width: 550px;
            width: 100%;
        }

        /* 得分面板 */
        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #0f281b;
            padding: 10px 22px;
            border-radius: 80px;
            margin-bottom: 18px;
            color: #e9f5e3;
            text-shadow: 0 2px 3px rgba(0,0,0,0.3);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-box, .best-box, .len-box {
            background: #071a10;
            padding: 5px 18px;
            border-radius: 50px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-box span:first-child, .best-box span:first-child, .len-box span:first-child {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-right: 8px;
        }

        .score-box span:last-child, .best-box span:last-child, .len-box span:last-child {
            font-size: 1.7rem;
            font-weight: 800;
            color: #ffd966;
            line-height: 1;
        }

        /* canvas 区域 */
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
        }

        canvas {
            background-color: #1e3a2f;
            border-radius: 28px;
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
            box-shadow: 0 0 0 3px #c0b9a2, 0 10px 25px rgba(0,0,0,0.3);
        }

        /* 自定义控制栏 (尺寸/速度) */
        .custom-bar {
            background: #182c20c9;
            border-radius: 48px;
            padding: 12px 16px;
            margin: 18px 0 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(2px);
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b2419;
            padding: 6px 16px;
            border-radius: 40px;
            flex: 1;
            min-width: 130px;
        }

        .ctrl-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #e0f0d8;
            letter-spacing: 1px;
        }

        select, input {
            background: #fef5cf;
            border: none;
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            text-align: center;
        }

        input[type="range"] {
            width: 120px;
            padding: 0;
            cursor: pointer;
        }

        .speed-value {
            background: #2c4233;
            padding: 4px 10px;
            border-radius: 30px;
            color: #ffd966;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        /* 手机十字方向键 (键盘布局) */
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 18px 0 12px;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 6px 0;
        }
        .dpad-btn {
            background: rgba(30, 55, 40, 0.95);
            backdrop-filter: blur(5px);
            width: 75px;
            height: 75px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: bold;
            color: #f7ecc7;
            box-shadow: 0 8px 0 #0f1f15, 0 5px 15px black;
            transition: 0.05s linear;
            cursor: pointer;
            touch-action: manipulation;
            border: 1px solid rgba(255, 235, 170, 0.5);
        }
        .dpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #0f1f15;
        }

        /* 控制按钮组 (开始/暂停/重置) */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #ffae5a;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2a2b1f;
            box-shadow: 0 5px 0 #7a3e1a;
            transition: 0.07s linear;
            cursor: pointer;
            font-family: inherit;
            min-width: 100px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7a3e1a;
        }
        .pause-btn {
            background: #5f8b6f;
            box-shadow: 0 5px 0 #2c4a38;
            color: #fcf9ea;
        }
        .restart-btn {
            background: #4e7b64;
            box-shadow: 0 5px 0 #2b4638;
            color: #fff2cf;
        }

        .status-text {
            text-align: center;
            margin-top: 12px;
            font-weight: 600;
            color: #fbffc4;
            background: #1f3a2b80;
            display: inline-block;
            width: 100%;
            padding: 6px 12px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
        }

        /* 手机小屏幕适配 */
        @media (max-width: 550px) {
            .game-container { padding: 14px 16px 20px; }
            .dpad-btn { width: 60px; height: 60px; font-size: 2.2rem; }
            .dpad-row { gap: 15px; }
            .ctrl-group { min-width: 115px; }
            .score-box span:last-child, .best-box span:last-child, .len-box span:last-child { font-size: 1.3rem; }
            .action-btn { padding: 7px 16px; font-size: 1rem; min-width: 85px; }
        }
        @media (max-width: 450px) {
            .dpad-btn { width: 52px; height: 52px; font-size: 1.9rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- 分数面板 -->
    <div class="score-panel">
        <div class="score-box"><span>🍎 分数</span><span id="scoreValue">0</span></div>
        <div class="len-box"><span>🐍 长度</span><span id="lenValue">3</span></div>
        <div class="best-box"><span>🏆 最高</span><span id="bestValue">0</span></div>
    </div>

    <!-- 画布 -->
    <div class="canvas-wrapper">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>

    <!-- 自定义区域 (尺寸 / 速度) -->
    <div class="custom-bar">
        <div class="ctrl-group">
            <label>🔲 尺寸</label>
            <select id="boardSizeSelect">
                <option value="12">12x12 (小)</option>
                <option value="15" selected>15x15 (中)</option>
                <option value="20">20x20 (大)</option>
                <option value="25">25x25 (挑战)</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label>⚡ 速度</label>
            <input type="range" id="speedSlider" min="70" max="280" step="5" value="140">
            <span id="speedValue" class="speed-value">140ms</span>
        </div>
    </div>

    <!-- 手机触摸十字方向键 (键盘布局) -->
    <div class="dpad">
        <div class="dpad-row">
            <div class="dpad-btn" data-dir="up">▲</div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn" data-dir="left">◀</div>
            <div class="dpad-btn" data-dir="down">▼</div>
            <div class="dpad-btn" data-dir="right">▶</div>
        </div>
    </div>

    <!-- 游戏操作按钮 -->
    <div class="action-buttons">
        <button class="action-btn" id="startBtn">▶ 开始</button>
        <button class="action-btn pause-btn" id="pauseBtn">⏸ 暂停</button>
        <button class="action-btn restart-btn" id="restartBtn">⟳ 重置</button>
    </div>
    <div class="status-text" id="gameStatusLabel">🎮 WASD / 方向键 + 滑动屏幕 | 自定义畅玩</div>
</div>

<script>
    (function(){
        // ---------- 动态全局变量 ----------
        let boardSize = 15;          // 当前尺寸 15x15
        let cellSize = 400 / boardSize; // 实时计算
        let snake = [];
        let food = { x: 10, y: 10 };
        let currentDirection = 'right';
        let nextDirection = 'right';
        let score = 0;
        let bestScore = 0;
        let isGameActive = true;      // 游戏未结束/胜利
        let isPaused = false;          // 暂停标志
        let isWinFlag = false;
        let gameInterval = null;
        
        // 速度相关
        let currentSpeedMs = 140;     // 默认140ms
        
        // DOM 元素
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');
        const lenSpan = document.getElementById('lenValue');
        const bestSpan = document.getElementById('bestValue');
        const boardSizeSelect = document.getElementById('boardSizeSelect');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueSpan = document.getElementById('speedValue');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameStatusSpan = document.getElementById('gameStatusLabel');
        
        // 辅助函数: 更新最高分存储 (针对当前尺寸)
        function getStorageKey() {
            return `snakeBestScore_${boardSize}`;
        }
        function loadBestScoreForSize() {
            const stored = localStorage.getItem(getStorageKey());
            if(stored && !isNaN(parseInt(stored))) {
                bestScore = parseInt(stored);
            } else {
                bestScore = 0;
            }
            bestSpan.innerText = bestScore;
        }
        function updateBestScore() {
            if(score > bestScore) {
                bestScore = score;
                bestSpan.innerText = bestScore;
                localStorage.setItem(getStorageKey(), bestScore);
            }
        }
        
        // 更新UI分数&长度
        function updateUI() {
            scoreSpan.innerText = score;
            lenSpan.innerText = snake.length;
        }
        
        // 重新计算cellSize
        function updateCellSize() {
            cellSize = canvas.width / boardSize;
        }
        
        // 生成不冲突的食物 (自动检测胜利)
        function generateValidFood() {
            if(snake.length >= boardSize * boardSize) {
                gameWin();
                return false;
            }
            const maxAttempts = 3000;
            for(let i = 0; i < maxAttempts; i++) {
                const randX = Math.floor(Math.random() * boardSize);
                const randY = Math.floor(Math.random() * boardSize);
                if(!snake.some(seg => seg.x === randX && seg.y === randY)) {
                    food = { x: randX, y: randY };
                    return true;
                }
            }
            // 保底遍历
            for(let i = 0; i < boardSize; i++) {
                for(let j = 0; j < boardSize; j++) {
                    if(!snake.some(seg => seg.x === i && seg.y === j)) {
                        food = { x: i, y: j };
                        return true;
                    }
                }
            }
            gameWin();
            return false;
        }
        
        // 胜利处理
        function gameWin() {
            if(!isGameActive) return;
            isGameActive = false;
            isWinFlag = true;
            isPaused = false;   // 胜利后不再恢复
            stopGameLoop();
            draw();
            gameStatusSpan.innerText = "✨ 完美通关！点击重置 ✨";
        }
        
        // 游戏结束
        function gameOver() {
            if(!isGameActive) return;
            isGameActive = false;
            isWinFlag = false;
            isPaused = false;
            stopGameLoop();
            updateBestScore();   // 记录最高分
            draw();
            gameStatusSpan.innerText = "💀 游戏结束，按「重置」继续挑战 💀";
        }
        
        // 停止循环
        function stopGameLoop() {
            if(gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }
        
        // 开始/重启循环 (使用当前速度)
        function startLoop() {
            if(gameInterval) stopGameLoop();
            if(!isGameActive) return;     // 死亡或胜利后不能移动
            if(isPaused) return;           // 暂停状态不启动定时器
            gameInterval = setInterval(() => {
                if(!isGameActive || isPaused) return;
                moveSnake();
            }, currentSpeedMs);
        }
        
        // 动态修改速度 (不停用游戏)
        function changeSpeed(newSpeedMs) {
            currentSpeedMs = newSpeedMs;
            speedValueSpan.innerText = currentSpeedMs + "ms";
            if(!isPaused && isGameActive) {
                // 游戏进行中且未暂停: 重启循环实现新速度
                if(gameInterval) {
                    stopGameLoop();
                    startLoop();
                }
            }
        }
        
        // 蛇移动核心
        function moveSnake() {
            if(!isGameActive) return false;
            
            let newDir = nextDirection;
            const opposite = { 'up':'down', 'down':'up', 'left':'right', 'right':'left' };
            if(opposite[newDir] === currentDirection) newDir = currentDirection;
            currentDirection = newDir;
            
            let newHead = { ...snake[0] };
            switch(currentDirection) {
                case 'right': newHead.x += 1; break;
                case 'left':  newHead.x -= 1; break;
                case 'up':    newHead.y -= 1; break;
                case 'down':  newHead.y += 1; break;
            }
            
            const willEat = (newHead.x === food.x && newHead.y === food.y);
            let newSnake;
            if(willEat) {
                newSnake = [newHead, ...snake];
            } else {
                newSnake = [newHead, ...snake.slice(0, -1)];
            }
            
            // 边界碰撞
            if(newHead.x < 0 || newHead.x >= boardSize || newHead.y < 0 || newHead.y >= boardSize) {
                gameOver();
                return false;
            }
            // 自身碰撞
            const headPos = newSnake[0];
            if(newSnake.slice(1).some(seg => seg.x === headPos.x && seg.y === headPos.y)) {
                gameOver();
                return false;
            }
            
            snake = newSnake;
            if(willEat) {
                score++;
                updateUI();
                updateBestScore();
                const success = generateValidFood();
                if(!success) return false;
                if(snake.length === boardSize * boardSize) {
                    gameWin();
                    return false;
                }
                if(!isGameActive) return false;
            }
            updateUI();
            draw();
            return true;
        }
        
        // 方向变更 (外部控制)
        function setDirection(newDir) {
            if(!isGameActive || isPaused) return;  // 暂停或结束时不能改变方向
            const opposite = { 'up':'down', 'down':'up', 'left':'right', 'right':'left' };
            if(opposite[newDir] === currentDirection) return;
            nextDirection = newDir;
        }
        
        // ---------- 游戏重置（完全重置，根据当前UI尺寸）----------
        function fullReset() {
            // 停止所有循环
            stopGameLoop();
            // 获取当前设定的尺寸和速度 (select value)
            const newSize = parseInt(boardSizeSelect.value);
            boardSize = newSize;
            updateCellSize();
            // 重置蛇身 (居中偏左)
            const startX = Math.floor(boardSize/2);
            const startY = Math.floor(boardSize/2);
            snake = [
                { x: startX, y: startY },
                { x: startX-1, y: startY },
                { x: startX-2, y: startY }
            ];
            // 边界检查初始位置合法性（若尺寸太小矫正）
            if(snake.some(s => s.x < 0 || s.x >= boardSize || s.y < 0 || s.y >= boardSize)) {
                // fallback: 简单重置
                snake = [
                    { x: 2, y: Math.floor(boardSize/2) },
                    { x: 1, y: Math.floor(boardSize/2) },
                    { x: 0, y: Math.floor(boardSize/2) }
                ];
            }
            currentDirection = 'right';
            nextDirection = 'right';
            score = 0;
            isGameActive = true;
            isWinFlag = false;
            isPaused = false;
            updateUI();
            // 加载当前尺寸下的最高分
            loadBestScoreForSize();
            // 生成有效食物
            generateValidFood();
            // 重置游戏状态标签
            gameStatusSpan.innerText = "🎮 游戏中 | WASD / 方向键 / 触屏方向";
            draw();
            // 开始循环
            startLoop();
        }
        
        // 单独应用新尺寸并重置
        function applySizeAndReset() {
            fullReset();
        }
        
        // 暂停逻辑
        function pauseGame() {
            if(!isGameActive) {
                gameStatusSpan.innerText = "游戏已结束，请按重置";
                return;
            }
            if(isPaused) return;
            isPaused = true;
            stopGameLoop();
            draw();  // 绘制暂停浮层
            gameStatusSpan.innerText = "⏸ 游戏已暂停，按「开始」继续";
        }
        
        // 开始/恢复逻辑
        function resumeGame() {
            if(!isGameActive) {
                // 如果游戏结束，可以重置? 但设计上开始按钮在结束时无效，给个提示，由重置来做
                if(!isGameActive && (isWinFlag || !isGameActive)) {
                    gameStatusSpan.innerText = "游戏已终结，请按「重置」开始新对局";
                }
                return;
            }
            if(!isPaused) return;
            isPaused = false;
            startLoop();
            draw();  // 取消暂停蒙层
            gameStatusSpan.innerText = "▶ 游戏中 | 自定义爽玩";
        }
        
        // ---------- 绘图 (支持暂停/结束图层) ----------
        function draw() {
            if(!ctx) return;
            ctx.clearRect(0, 0, 400, 400);
            // 绘制网格 (动态适应cellSize)
            ctx.strokeStyle = '#2f6b4a';
            ctx.lineWidth = 0.6;
            for(let i = 0; i <= boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, 400);
                ctx.stroke();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(400, i * cellSize);
                ctx.stroke();
            }
            
            // 食物
            const fx = food.x * cellSize;
            const fy = food.y * cellSize;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(fx + cellSize/2, fy + cellSize/2, cellSize/2 - 2, 0, Math.PI*2);
            ctx.fillStyle = '#ff5e57';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(fx + cellSize/2, fy + cellSize/2, cellSize/2 - 4, 0, Math.PI*2);
            ctx.fillStyle = '#ff8a7a';
            ctx.fill();
            ctx.fillStyle = '#f8d94c';
            ctx.beginPath();
            ctx.arc(fx + cellSize/2 - 2, fy + cellSize/2 - 2, 2, 0, Math.PI*2);
            ctx.fill();
            
            // 蛇
            for(let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const x = seg.x * cellSize;
                const y = seg.y * cellSize;
                const grad = ctx.createLinearGradient(x, y, x+cellSize, y+cellSize);
                if(i === 0) {
                    grad.addColorStop(0, '#7ec850');
                    grad.addColorStop(1, '#549c2e');
                } else {
                    grad.addColorStop(0, '#68b83a');
                    grad.addColorStop(1, '#3f8520');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(x+1, y+1, cellSize-2, cellSize-2);
                if(i === 0) {
                    ctx.fillStyle = "#ffffff";
                    const eyeOff = Math.max(3, cellSize/5);
                    if(currentDirection === 'right') {
                        ctx.beginPath();
                        ctx.arc(x+cellSize-eyeOff, y+eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff, y+cellSize-eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#0f1f15";
                        ctx.beginPath();
                        ctx.arc(x+cellSize-eyeOff+1, y+eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff+1, y+cellSize-eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.fill();
                    } else if(currentDirection === 'left') {
                        ctx.beginPath();
                        ctx.arc(x+eyeOff, y+eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.arc(x+eyeOff, y+cellSize-eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#0f1f15";
                        ctx.beginPath();
                        ctx.arc(x+eyeOff-1, y+eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.arc(x+eyeOff-1, y+cellSize-eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.fill();
                    } else if(currentDirection === 'up') {
                        ctx.beginPath();
                        ctx.arc(x+eyeOff, y+eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff, y+eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#0f1f15";
                        ctx.beginPath();
                        ctx.arc(x+eyeOff-1, y+eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff+1, y+eyeOff-1, 1.2, 0, Math.PI*2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(x+eyeOff, y+cellSize-eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff, y+cellSize-eyeOff, Math.max(2, cellSize/7), 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = "#0f1f15";
                        ctx.beginPath();
                        ctx.arc(x+eyeOff-1, y+cellSize-eyeOff+1, 1.2, 0, Math.PI*2);
                        ctx.arc(x+cellSize-eyeOff+1, y+cellSize-eyeOff+1, 1.2, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }
            
            // 暂停蒙层 / 结束蒙层
            if(!isGameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, 400, 400);
                ctx.font = "bold 24px 'Segoe UI'";
                ctx.fillStyle = "#FFE3B0";
                ctx.textAlign = "center";
                if(isWinFlag) ctx.fillText("🏆 胜利 🏆", 200, 180);
                else ctx.fillText("☠️ GAME OVER ☠️", 200, 180);
                ctx.font = "16px system-ui";
                ctx.fillStyle = "#cfecbe";
                ctx.fillText("点击「重置」继续", 200, 260);
                ctx.textAlign = "left";
            } else if(isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, 400, 400);
                ctx.font = "bold 26px system-ui";
                ctx.fillStyle = "#ffe5a3";
                ctx.textAlign = "center";
                ctx.fillText("⏸ 暂停中", 200, 200);
                ctx.font = "14px system-ui";
                ctx.fillStyle = "#cdffb2";
                ctx.fillText("按「开始」继续游戏", 200, 270);
                ctx.textAlign = "left";
            }
        }
        
        // ---------- 事件绑定 ----------
        function bindControls() {
            // 十字键 (手机/PC)
            document.querySelectorAll('.dpad-btn').forEach(btn => {
                const dir = btn.getAttribute('data-dir');
                const handle = (e) => { e.preventDefault(); setDirection(dir); };
                btn.addEventListener('touchstart', handle, {passive: false});
                btn.addEventListener('mousedown', handle);
                btn.addEventListener('click', (e) => { e.preventDefault(); setDirection(dir); });
            });
            
            // 键盘 (WASD + 方向键)
            window.addEventListener('keydown', (e) => {
                const k = e.key;
                let dir = null;
                if(k === 'w' || k === 'W' || k === 'ArrowUp') dir = 'up';
                else if(k === 's' || k === 'S' || k === 'ArrowDown') dir = 'down';
                else if(k === 'a' || k === 'A' || k === 'ArrowLeft') dir = 'left';
                else if(k === 'd' || k === 'D' || k === 'ArrowRight') dir = 'right';
                if(dir) { e.preventDefault(); setDirection(dir); }
            });
            
            // 滑动触控 (canvas)
            let touchStart = null;
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                touchStart = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
            });
            canvas.addEventListener('touchmove', (e) => {
                if(!touchStart) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const mx = touch.clientX - rect.left, my = touch.clientY - rect.top;
                const dx = mx - touchStart.x, dy = my - touchStart.y;
                if(Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
                let dir = null;
                if(Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
                else dir = dy > 0 ? 'down' : 'up';
                if(dir) setDirection(dir);
                touchStart = null;
            });
            canvas.addEventListener('touchend', () => { touchStart = null; });
        }
        
        // 尺寸监听 & 速度监听
        function bindCustomEvents() {
            boardSizeSelect.addEventListener('change', () => {
                fullReset();   // 尺寸改变自动重置
            });
            speedSlider.addEventListener('input', (e) => {
                const newSp = parseInt(e.target.value);
                changeSpeed(newSp);
            });
        }
        
        // 按钮事件
        function bindActionButtons() {
            startBtn.addEventListener('click', () => resumeGame());
            pauseBtn.addEventListener('click', () => pauseGame());
            restartBtn.addEventListener('click', () => fullReset());
        }
        
        // 初始化全部
        function init() {
            bindControls();
            bindCustomEvents();
            bindActionButtons();
            // 初始设置速度值显示
            currentSpeedMs = parseInt(speedSlider.value);
            speedValueSpan.innerText = currentSpeedMs + "ms";
            fullReset();  // 完整启动
        }
        
        init();
    })();
</script>
</body>
</html>

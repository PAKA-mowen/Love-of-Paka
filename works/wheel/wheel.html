<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>梦幻幸运大转盘 | 预设自动加载</title>
    <style>
        :root {
            --bg-dark: #0f1a24;
            --panel-bg: rgba(20, 30, 40, 0.85);
            --gold: #ffd98c;
            --gold-light: #ffecb3;
            --accent: #ffaa44;
            --accent2: #ff6e3a;
            --text-soft: #f7e5c2;
            --card-bg: rgba(10, 20, 28, 0.7);
            --border-soft: rgba(255, 190, 100, 0.4);
            --shadow-lg: 0 20px 45px rgba(0, 0, 0, 0.35);
            --radius-xl: 48px;
            --radius-full: 60px;
            --transition-fast: 0.18s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            padding: 20px 12px;
        }

        .app-shell {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }

        /* 左侧预设面板 - 纯净版 */
        .presets-panel {
            flex: 0 0 220px;
            width: 220px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            border-radius: var(--radius-xl);
            padding: 16px 10px 14px;
            border: 1px solid rgba(255, 210, 140, 0.5);
            box-shadow: var(--shadow-lg), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 82vh;
            position: sticky;
            top: 20px;
        }
        .presets-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 6px;
            border-bottom: 1px solid rgba(255, 200, 120, 0.3);
            margin-bottom: 4px;
        }
        .presets-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffdeae;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .presets-count {
            font-size: 11px;
            background: rgba(255, 180, 70, 0.25);
            color: #ffd58c;
            padding: 2px 9px;
            border-radius: 20px;
            font-weight: 600;
        }
        .presets-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 2px 2px 4px;
            min-height: 100px;
            max-height: 55vh;
        }
        .presets-list::-webkit-scrollbar {
            width: 4px;
        }
        .presets-list::-webkit-scrollbar-track {
            background: #1e2d38;
            border-radius: 8px;
        }
        .presets-list::-webkit-scrollbar-thumb {
            background: #ffb85e;
            border-radius: 8px;
        }

        .preset-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background: rgba(18, 28, 36, 0.7);
            border: 1px solid rgba(255, 190, 100, 0.3);
            border-radius: 24px;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: #e8d5b8;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            font-family: inherit;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }
        .preset-btn:hover {
            background: rgba(40, 55, 65, 0.8);
            border-color: rgba(255, 200, 120, 0.7);
            color: #fff3db;
            transform: translateX(2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        .preset-btn:active {
            transform: scale(0.97);
        }
        .preset-btn.active-preset {
            background: linear-gradient(120deg, rgba(255, 160, 50, 0.35), rgba(255, 110, 40, 0.3));
            border-color: #ffc878;
            color: #fff6e5;
            box-shadow: 0 0 16px rgba(255, 160, 60, 0.25);
            font-weight: 700;
        }
        .preset-btn.active-preset::after {
            content: '✓';
            position: absolute;
            right: 12px;
            font-size: 14px;
            color: #ffd78b;
            font-weight: bold;
        }
        .preset-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }
        .preset-info {
            flex: 1;
            min-width: 0;
        }
        .preset-name {
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preset-opt-count {
            font-size: 9px;
            color: #b8a080;
            margin-top: 1px;
        }

        /* 转盘主容器 */
        .wheel-container {
            flex: 1;
            max-width: 560px;
            min-width: 340px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 72px 72px 56px 56px;
            box-shadow: var(--shadow-lg), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            padding: 20px 20px 28px;
            transition: all 0.3s ease;
        }

        .result-area {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 100px;
            margin-bottom: 22px;
            padding: 12px 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 150, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .result-label {
            font-size: 13px;
            letter-spacing: 2px;
            color: #ffecb3;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 1px 1px black;
        }
        .result-name {
            font-size: 26px;
            font-weight: 800;
            margin-top: 3px;
            word-break: break-word;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff0c0, #ffd966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            transition: transform 0.2s ease;
        }
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }
        canvas {
            width: 100%;
            max-width: 380px;
            height: auto;
            background: #f9e5c1;
            border-radius: 50%;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), 0 0 0 8px #f7cf8c, 0 0 0 12px #bf8f50;
            transition: box-shadow 0.2s;
            cursor: pointer;
        }
        canvas:active {
            transform: scale(0.99);
        }
        .spin-btn {
            display: block;
            width: 140px;
            margin: 8px auto 18px;
            background: linear-gradient(120deg, #ffb347, #ff6e3a);
            border: none;
            padding: 14px 0;
            font-size: 23px;
            font-weight: bold;
            color: #fff3e0;
            text-shadow: 0 2px 3px #b53b00;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #963d1a;
            letter-spacing: 4px;
            font-family: inherit;
        }
        .spin-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #963d1a;
        }
        .spin-btn.disabled {
            opacity: 0.55;
            transform: translateY(0);
            pointer-events: none;
            filter: grayscale(0.15);
        }

        .options-panel {
            background: rgba(30, 40, 50, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 14px 10px 18px;
            margin-top: 10px;
            border: 1px solid rgba(255, 210, 140, 0.5);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.2), 0 8px 18px rgba(0, 0, 0, 0.2);
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffdeae;
            padding-left: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .options-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 2px 6px;
            margin-bottom: 16px;
        }
        .options-list::-webkit-scrollbar {
            width: 4px;
        }
        .options-list::-webkit-scrollbar-track {
            background: #2a3b44;
            border-radius: 10px;
        }
        .options-list::-webkit-scrollbar-thumb {
            background: #ffb85e;
            border-radius: 10px;
        }
        .option-item {
            background: var(--card-bg);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px 5px 18px;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-soft);
            transition: all 0.2s;
        }
        .option-name {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: #f7e5c2;
            word-break: break-word;
            padding-right: 4px;
            text-shadow: 0 1px 0 #1e2a32;
        }
        .option-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .action-btn {
            background: rgba(255, 215, 150, 0.2);
            border: none;
            font-size: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            color: #ffd98c;
            backdrop-filter: blur(4px);
        }
        .action-btn.edit-btn:hover {
            background: #3d7ca3;
            color: white;
            transform: scale(1.05);
        }
        .action-btn.del-btn:hover {
            background: #b13e3e;
            color: white;
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .add-section {
            display: flex;
            gap: 10px;
            padding: 6px 10px;
            margin-top: 4px;
        }
        .add-input {
            flex: 1;
            background: #17242e;
            border: 1px solid #ffcd8a;
            border-radius: 50px;
            padding: 11px 16px;
            font-size: 15px;
            color: #ffefcf;
            outline: none;
            font-weight: 500;
        }
        .add-input::placeholder {
            color: #9aaeb9;
            font-weight: normal;
        }
        .add-btn {
            background: #ffaa44;
            border: none;
            border-radius: 50px;
            padding: 0 24px;
            font-size: 17px;
            font-weight: bold;
            color: #2e241f;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 0 #a45d1a;
        }
        .add-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a45d1a;
        }
        .info-tip {
            font-size: 11px;
            text-align: center;
            margin-top: 14px;
            color: #bcb08b;
            letter-spacing: 0.5px;
        }

        /* 移动端折叠 */
        .presets-toggle-mobile {
            display: none;
            width: 100%;
            padding: 10px 16px;
            border-radius: 28px;
            border: 1px solid rgba(255, 200, 120, 0.5);
            background: rgba(20, 30, 40, 0.8);
            color: #ffdba0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            font-family: inherit;
            backdrop-filter: blur(6px);
            transition: all var(--transition-fast);
            margin-bottom: 12px;
        }
        .presets-toggle-mobile:hover {
            background: rgba(40, 55, 65, 0.85);
            border-color: #ffc878;
        }

        @media (max-width: 820px) {
            .app-shell {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }
            .presets-panel {
                flex: 0 0 auto;
                width: 100%;
                max-width: 560px;
                position: static;
                max-height: none;
                border-radius: 36px;
                padding: 12px 10px 10px;
                gap: 4px;
            }
            .presets-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                max-height: none;
                overflow-y: visible;
                padding: 2px 0;
            }
            .preset-btn {
                flex: 0 0 auto;
                width: auto;
                padding: 8px 12px;
                font-size: 11px;
                border-radius: 20px;
                gap: 4px;
            }
            .preset-btn .preset-icon {
                font-size: 14px;
                width: auto;
            }
            .preset-btn .preset-name {
                font-size: 10px;
            }
            .preset-btn .preset-opt-count {
                display: none;
            }
            .preset-btn.active-preset::after {
                display: none;
            }
            .presets-toggle-mobile {
                display: block;
            }
            .presets-panel.collapsed-mobile .presets-list,
            .presets-panel.collapsed-mobile .presets-header {
                display: none;
            }
            .presets-panel.collapsed-mobile {
                padding: 0;
                background: transparent;
                border: none;
                box-shadow: none;
            }
            .presets-panel.collapsed-mobile .presets-toggle-mobile {
                margin-bottom: 0;
            }
            .wheel-container {
                max-width: 100%;
                min-width: 0;
                border-radius: 48px 48px 40px 40px;
                padding: 14px 12px 20px;
            }
            .result-name {
                font-size: 20px;
            }
            .spin-btn {
                width: 120px;
                font-size: 20px;
                padding: 12px 0;
            }
            canvas {
                max-width: 300px;
            }
            .option-name {
                font-size: 14px;
            }
            .action-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .add-input {
                padding: 9px 12px;
                font-size: 14px;
            }
            .add-btn {
                padding: 0 18px;
                font-size: 15px;
            }
        }
        @media (max-width: 420px) {
            canvas {
                max-width: 250px;
            }
            .spin-btn {
                width: 100px;
                font-size: 18px;
                padding: 10px 0;
                letter-spacing: 2px;
            }
            .result-name {
                font-size: 17px;
            }
            .preset-btn {
                padding: 6px 8px;
                font-size: 10px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- 左侧预设面板 - 仅显示预设列表，无任何按钮 -->
        <aside class="presets-panel" id="presetsPanel">
            <button class="presets-toggle-mobile" id="presetsToggleMobile" title="展开/收起预设面板">
                📋 预设方案 ▾
            </button>
            <div class="presets-header">
                <span class="presets-title">📦 预设方案</span>
                <span class="presets-count" id="presetsCount">0</span>
            </div>
            <div class="presets-list" id="presetsList">
                <div style="color:#bcb08b; font-size:13px; padding:8px; text-align:center;">
                    🚀 正在加载预设...
                </div>
            </div>
            <!-- 移除了所有操作按钮，预设完全由 presets/ 文件夹中的 JSON 文件定义 -->
        </aside>

        <!-- 右侧转盘主容器 -->
        <div class="wheel-container">
            <div class="result-area">
                <div class="result-label">✨ 当前指针所指 ✨</div>
                <div class="result-name" id="currentPickName">等待转动</div>
            </div>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>
            <button class="spin-btn" id="spinButton">🎡 旋转</button>
            <div class="options-panel">
                <div class="panel-title">🎨 自定义转盘列表</div>
                <div class="options-list" id="optionsList"></div>
                <div class="add-section">
                    <input type="text" id="newOptionName" class="add-input" placeholder="输入新选项, 例如: 一等奖" maxlength="20">
                    <button id="addOptionBtn" class="add-btn">＋ 添加</button>
                </div>
                <div class="info-tip">✏️ 点击编辑/删除 | 预设方案请修改 presets/ 中的 JSON 文件</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  预设管理 - 纯自动加载版本（无导入/导出/保存按钮）
            //  所有预设来源于 presets/ 文件夹下的 JSON 文件
            //  如需添加新预设，请在 presets/ 下新建 .json 文件，
            //  并将文件名添加至下方的 KNOWN_PRESET_FILES 数组中
            // ============================================================
            const KNOWN_PRESET_FILES = [
                'dinner.json',
                'lottery.json',
                'treat.json',
                'weekend.json',
                'teatime.json'
                // 可在此添加更多预设文件名，例如 'my_custom.json'
            ];

            let allPresets = [];           // 从文件加载的预设列表
            let activePresetId = null;    // 当前激活的预设ID

            // 转盘选项（初始默认，稍后会被第一个预设覆盖）
            let options = [
                { name: "🌟 自选餐", color: "" },
                { name: "🍕 大盘子饭", color: "" },
                { name: "🎬 鸡丝拌面", color: "" }
            ];

            let currentRotation = 0;
            let animating = false;
            let animationId = null;
            let spinStartTime = 0;
            let spinDuration = 1800;
            let startRotation = 0;
            let targetRotation = 0;

            // DOM 元素
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinButton');
            const optionsListDiv = document.getElementById('optionsList');
            const newOptionInput = document.getElementById('newOptionName');
            const addBtn = document.getElementById('addOptionBtn');
            const currentPickSpan = document.getElementById('currentPickName');
            const presetsListDiv = document.getElementById('presetsList');
            const presetsCountSpan = document.getElementById('presetsCount');
            const presetsPanel = document.getElementById('presetsPanel');
            const presetsToggleMobile = document.getElementById('presetsToggleMobile');

            let canvasSize = 600;
            let centerX = 300,
                centerY = 300;
            let radius = 280;
            const POINTER_ANGLE = -Math.PI / 2;

            // ============================================================
            //  从 presets/ 文件夹加载单个 JSON 预设
            // ============================================================
            async function loadPresetFromFile(filename) {
                try {
                    const response = await fetch(`presets/${filename}`, { cache: 'no-cache' });
                    if (!response.ok) throw new Error('文件不存在');
                    const data = await response.json();
                    if (data && data.id && data.name && Array.isArray(data.options)) {
                        return {
                            id: data.id,
                            name: data.name,
                            icon: data.icon || '📋',
                            options: data.options
                        };
                    }
                } catch (e) {
                    console.warn(`预设文件 ${filename} 加载失败或格式不正确`);
                }
                return null;
            }

            async function autoLoadAllPresets() {
                const loadedPresets = [];
                for (const filename of KNOWN_PRESET_FILES) {
                    const preset = await loadPresetFromFile(filename);
                    if (preset) loadedPresets.push(preset);
                }
                return loadedPresets;
            }

            // ============================================================
            //  预设交互：点击加载
            // ============================================================
            function findPresetById(id) {
                return allPresets.find(p => p.id === id);
            }

            function loadPresetById(id) {
                if (animating) return;
                const preset = findPresetById(id);
                if (!preset) return;
                options = preset.options.map(name => ({ name: name, color: '' }));
                refreshColors();
                currentRotation = 0;
                activePresetId = id;
                drawWheel();
                updateCurrentPickName();
                renderOptionsList();
                renderPresetsList();
            }

            // ============================================================
            //  渲染预设列表（纯净版，无删除功能）
            // ============================================================
            function renderPresetsList() {
                presetsListDiv.innerHTML = '';
                if (allPresets.length === 0) {
                    presetsListDiv.innerHTML = '<div style="color:#bcb08b; font-size:13px; padding:8px; text-align:center;">📁 未找到预设<br>请检查 presets 文件夹</div>';
                    presetsCountSpan.textContent = '0';
                    return;
                }
                allPresets.forEach(preset => {
                    const isActive = preset.id === activePresetId;
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn' + (isActive ? ' active-preset' : '');
                    btn.title = preset.options.join(', ');
                    btn.innerHTML = `
                        <span class="preset-icon">${escapeHtml(preset.icon)}</span>
                        <span class="preset-info">
                            <span class="preset-name">${escapeHtml(preset.name)}</span>
                            <span class="preset-opt-count">${preset.options.length} 个选项</span>
                        </span>
                    `;
                    btn.addEventListener('click', () => loadPresetById(preset.id));
                    presetsListDiv.appendChild(btn);
                });
                presetsCountSpan.textContent = allPresets.length;
            }

            // ============================================================
            //  颜色与转盘绘制（保持不变）
            // ============================================================
            function generateColorPalette(count) {
                const colors = [];
                for (let i = 0; i < count; i++) {
                    const hue = (i * 137.5) % 360;
                    colors.push(`hsl(${hue}, 70%, 65%)`);
                }
                return colors;
            }

            function refreshColors() {
                const palette = generateColorPalette(options.length);
                for (let i = 0; i < options.length; i++) {
                    options[i].color = palette[i];
                }
            }

            function getCurrentIndex(rotationRad) {
                if (options.length === 0) return -1;
                const anglePerSector = (Math.PI * 2) / options.length;
                for (let i = 0; i < options.length; i++) {
                    let start = i * anglePerSector;
                    let end = (i + 1) * anglePerSector;
                    let realStart = start + rotationRad;
                    let realEnd = end + rotationRad;
                    let normPointer = POINTER_ANGLE;
                    while (normPointer < 0) normPointer += Math.PI * 2;
                    while (normPointer >= Math.PI * 2) normPointer -= Math.PI * 2;
                    let rStart = realStart % (Math.PI * 2);
                    let rEnd = realEnd % (Math.PI * 2);
                    if (rStart < 0) rStart += Math.PI * 2;
                    if (rEnd < 0) rEnd += Math.PI * 2;
                    if (rStart < rEnd) {
                        if (normPointer >= rStart && normPointer < rEnd) return i;
                    } else {
                        if (normPointer >= rStart || normPointer < rEnd) return i;
                    }
                }
                return 0;
            }

            function updateCurrentPickName() {
                if (options.length === 0) {
                    currentPickSpan.innerText = "无选项";
                    return;
                }
                const idx = getCurrentIndex(currentRotation);
                if (idx !== -1 && options[idx]) {
                    currentPickSpan.innerText = options[idx].name;
                } else {
                    currentPickSpan.innerText = "✨ 幸运 ✨";
                }
            }

            function drawWheel() {
                if (!ctx) return;
                const len = options.length;
                if (len === 0) {
                    ctx.clearRect(0, 0, canvasSize, canvasSize);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = "#2c3e44";
                    ctx.fill();
                    ctx.fillStyle = "#ffd58c";
                    ctx.font = "bold 20px 'Segoe UI'";
                    ctx.fillText("请添加选项", centerX - 70, centerY);
                    return;
                }
                const angleStep = (Math.PI * 2) / len;
                ctx.clearRect(0, 0, canvasSize, canvasSize);
                for (let i = 0; i < len; i++) {
                    const start = i * angleStep + currentRotation;
                    const end = (i + 1) * angleStep + currentRotation;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, start, end);
                    ctx.closePath();
                    ctx.fillStyle = options[i].color;
                    ctx.fill();
                    ctx.save();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = "rgba(255,245,200,0.7)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, start, end);
                    ctx.lineTo(centerX, centerY);
                    ctx.stroke();
                    const midAngle = start + angleStep / 2;
                    const textRadius = radius * 0.68;
                    const x = centerX + Math.cos(midAngle) * textRadius;
                    const y = centerY + Math.sin(midAngle) * textRadius;
                    let text = options[i].name;
                    let fontSize = 20;
                    if (text.length > 8) fontSize = 16;
                    if (text.length > 12) fontSize = 13;
                    ctx.font = `500 ${fontSize}px "Segoe UI", "Poppins", system-ui`;
                    ctx.fillStyle = "#1f2c30";
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = "rgba(0,0,0,0)";
                    ctx.save();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,245,210,0.85)";
                    const metrics = ctx.measureText(text);
                    const textWidth = metrics.width;
                    const padding = 8;
                    ctx.beginPath();
                    ctx.roundRect(x - textWidth / 2 - 4, y - fontSize / 2 - 2, textWidth + 8, fontSize + 6, 12);
                    ctx.fill();
                    ctx.fillStyle = "#1f2933";
                    ctx.font = `500 ${fontSize}px "Segoe UI", "Poppins", system-ui`;
                    ctx.fillText(text, x - textWidth / 2, y + fontSize / 2 - 2);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY, 32, 0, 2 * Math.PI);
                ctx.fillStyle = "#f9d976";
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(centerX, centerY, 22, 0, 2 * Math.PI);
                ctx.fillStyle = "#dcb570";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(centerX, centerY, 12, 0, 2 * Math.PI);
                ctx.fillStyle = "#f9e0a0";
                ctx.fill();
                drawFixedPointer();
            }

            function drawFixedPointer() {
                const tipX = centerX;
                const tipY = centerY - radius - 6;
                const baseW = 28;
                const baseH = 22;
                ctx.save();
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(tipX - baseW / 2, tipY + baseH);
                ctx.lineTo(tipX + baseW / 2, tipY + baseH);
                ctx.fillStyle = "#ffd966";
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(tipX - baseW / 3, tipY + baseH - 4);
                ctx.lineTo(tipX + baseW / 3, tipY + baseH - 4);
                ctx.fillStyle = "#ffb347";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(tipX, tipY + 6, 8, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffbc6e";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(tipX, tipY + 4, 4, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffebc2";
                ctx.fill();
                ctx.restore();
            }

            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (w < 2 * r) r = w / 2;
                    if (h < 2 * r) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    return this;
                };
            }

            function resizeCanvas() {
                const container = canvas.parentElement;
                const maxSize = Math.min(container.clientWidth, 420);
                canvas.style.width = `${maxSize}px`;
                canvas.style.height = `${maxSize}px`;
                canvas.width = 600;
                canvas.height = 600;
                centerX = 300;
                centerY = 300;
                radius = 272;
                drawWheel();
            }
            window.addEventListener('resize', () => { resizeCanvas();
                drawWheel(); });

            // ============================================================
            //  选项列表渲染（编辑/删除功能仍保留，但不会影响预设文件）
            // ============================================================
            function renderOptionsList() {
                optionsListDiv.innerHTML = '';
                for (let i = 0; i < options.length; i++) {
                    const item = options[i];
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.innerHTML = `
                        <span class="option-name">${escapeHtml(item.name)}</span>
                        <div class="option-actions">
                            <button class="action-btn edit-btn" data-index="${i}">✏️</button>
                            <button class="action-btn del-btn" data-index="${i}">🗑️</button>
                        </div>
                    `;
                    optionsListDiv.appendChild(div);
                }
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (animating) return;
                        const idx = parseInt(btn.dataset.index);
                        const newName = prompt("修改选项名称", options[idx].name);
                        if (newName && newName.trim() !== "") {
                            options[idx].name = newName.trim().slice(0, 22);
                            // 手动修改选项后，断开与预设的关联
                            activePresetId = null;
                            drawWheel();
                            updateCurrentPickName();
                            renderOptionsList();
                            renderPresetsList();
                        }
                    });
                });
                document.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (animating) return;
                        if (options.length <= 1) {
                            alert("至少保留一个选项，无法删除");
                            return;
                        }
                        const idx = parseInt(btn.dataset.index);
                        options.splice(idx, 1);
                        activePresetId = null;
                        refreshColors();
                        drawWheel();
                        updateCurrentPickName();
                        renderOptionsList();
                        renderPresetsList();
                    });
                });
            }

            function escapeHtml(str) {
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function addNewOption() {
                if (animating) return;
                let newName = newOptionInput.value.trim();
                if (!newName) {
                    alert("请输入选项名称");
                    return;
                }
                if (newName.length > 20) newName = newName.slice(0, 20);
                options.push({ name: newName, color: "" });
                activePresetId = null;
                refreshColors();
                drawWheel();
                updateCurrentPickName();
                renderOptionsList();
                renderPresetsList();
                newOptionInput.value = "";
                newOptionInput.focus();
            }

            // ============================================================
            //  旋转动画
            // ============================================================
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function computeTargetRotationForIndex(targetIdx, currRot, extraCircles) {
                if (options.length === 0) return currRot;
                const anglePer = (Math.PI * 2) / options.length;
                let startRaw = targetIdx * anglePer;
                let endRaw = (targetIdx + 1) * anglePer;
                let low = POINTER_ANGLE - endRaw;
                let high = POINTER_ANGLE - startRaw;
                const twoPi = Math.PI * 2;
                let normLow = ((low % twoPi) + twoPi) % twoPi;
                let normHigh = ((high % twoPi) + twoPi) % twoPi;
                let finalBase;
                if (normLow <= normHigh) {
                    finalBase = (normLow + normHigh) / 2;
                } else {
                    let mid = (normLow + normHigh + twoPi) / 2;
                    finalBase = mid % twoPi;
                }
                let delta = finalBase - (currRot % twoPi);
                if (delta < 0) delta += twoPi;
                const extraFull = extraCircles * twoPi;
                return currRot + delta + extraFull;
            }

            function startSpin() {
                if (animating) return;
                if (options.length === 0) {
                    alert("请先添加选项再旋转!");
                    return;
                }
                const randIndex = Math.floor(Math.random() * options.length);
                const extraCircles = 6 + Math.floor(Math.random() * 7);
                const newTargetRot = computeTargetRotationForIndex(randIndex, currentRotation, extraCircles);
                startRotation = currentRotation;
                targetRotation = newTargetRot;
                spinStartTime = performance.now();
                animating = true;
                spinBtn.classList.add('disabled');

                function step(now) {
                    const elapsed = now - spinStartTime;
                    let t = Math.min(1, elapsed / spinDuration);
                    const easeT = easeOutCubic(t);
                    const newRot = startRotation + (targetRotation - startRotation) * easeT;
                    currentRotation = newRot;
                    drawWheel();
                    updateCurrentPickName();
                    if (t < 1) {
                        animationId = requestAnimationFrame(step);
                    } else {
                        currentRotation = targetRotation;
                        drawWheel();
                        updateCurrentPickName();
                        animating = false;
                        spinBtn.classList.remove('disabled');
                        if (animationId) cancelAnimationFrame(animationId);
                        animationId = null;
                        const finalName = options[randIndex]?.name || "幸运儿";
                        currentPickSpan.style.transform = "scale(1.08)";
                        setTimeout(() => { currentPickSpan.style.transform = ""; }, 200);
                    }
                }
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(step);
            }

            // ============================================================
            //  事件绑定
            // ============================================================
            function bindEvents() {
                spinBtn.addEventListener('click', startSpin);
                addBtn.addEventListener('click', addNewOption);
                newOptionInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addNewOption();
                });

                // 移动端折叠
                presetsToggleMobile.addEventListener('click', () => {
                    presetsPanel.classList.toggle('collapsed-mobile');
                    const isCollapsed = presetsPanel.classList.contains('collapsed-mobile');
                    presetsToggleMobile.textContent = isCollapsed ? '📋 展开预设 ▸' : '📋 预设方案 ▾';
                });
            }

            // ============================================================
            //  初始化
            // ============================================================
            async function init() {
                resizeCanvas();
                // 自动加载所有预设文件
                allPresets = await autoLoadAllPresets();

                // 如果有预设，加载第一个作为默认
                if (allPresets.length > 0) {
                    const firstPreset = allPresets[0];
                    options = firstPreset.options.map(name => ({ name: name, color: '' }));
                    activePresetId = firstPreset.id;
                } else {
                    // 无预设时保留示例选项，并提示
                    options = [
                        { name: "🌟 自选餐", color: "" },
                        { name: "🍕 大盘子饭", color: "" },
                        { name: "🎬 鸡丝拌面", color: "" }
                    ];
                }

                refreshColors();
                drawWheel();
                updateCurrentPickName();
                renderOptionsList();
                renderPresetsList();
                bindEvents();
            }

            window.addEventListener('load', () => {
                init();
            });
        })();
    </script>
</body>

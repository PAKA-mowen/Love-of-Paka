<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Artistic Dice Roller | 骰子大王</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* 主卡片容器 */
        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 头部控制区 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            margin-bottom: 3rem;
            background: rgba(0, 0, 0, 0.35);
            padding: 1.2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(4px);
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .select-group label {
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffdfb8;
            text-shadow: 0 2px 3px rgba(0,0,0,0.3);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .dice-count {
            background: #2c3e2f;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fae67a;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(2px);
            background: rgba(20, 30, 25, 0.8);
            border: 1px solid rgba(255, 215, 150, 0.6);
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .dice-count:hover {
            background: #3a4a3c;
            border-color: #ffcd7e;
            color: #fff0cc;
        }

        .roll-all-btn {
            background: linear-gradient(135deg, #ff9a5f, #ff6a3d);
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: inherit;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 18px rgba(255, 85, 40, 0.4);
            letter-spacing: 1px;
        }

        .roll-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 85, 40, 0.6);
            background: linear-gradient(135deg, #ffb07c, #ff8254);
        }

        .roll-all-btn:active {
            transform: translateY(2px);
        }

        /* 骰子网格容器 */
        .dice-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin: 1rem 0 1rem;
            min-height: 320px;
            transition: all 0.2s;
        }

        /* 单个骰子卡片 */
        .dice-card {
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
        }

        /* 画布容器 */
        canvas.dice-canvas {
            display: block;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: box-shadow 0.2s, transform 0.1s;
            background: white;
            cursor: pointer;
        }

        .dice-card:hover canvas.dice-canvas {
            transform: scale(1.02);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
        }

        /* 下方数字艺术风格 */
        .dice-value {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f9e0a0, #e6b86e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.2);
            min-width: 55px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
            backdrop-filter: blur(2px);
            padding: 0.2rem 0.4rem;
            border-radius: 40px;
        }

        /* 动态旋转动画 */
        @keyframes diceRollAnim {
            0% {
                transform: rotate(0deg) scale(1);
                filter: brightness(1);
            }
            25% {
                transform: rotate(15deg) scale(0.95);
                filter: brightness(1.2);
            }
            50% {
                transform: rotate(-10deg) scale(1.05);
                filter: brightness(1.1);
            }
            75% {
                transform: rotate(5deg) scale(0.98);
                filter: brightness(1.15);
            }
            100% {
                transform: rotate(0deg) scale(1);
                filter: brightness(1);
            }
        }

        .roll-animation {
            animation: diceRollAnim 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        /* 空状态/提示 */
        .empty-note {
            color: #ffe1b3;
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            font-weight: 500;
            background: rgba(0,0,0,0.3);
            border-radius: 2rem;
        }

        /* 页脚小字 */
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #c0b28a;
            opacity: 0.7;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .app-container {
                padding: 1.2rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .roll-all-btn {
                justify-content: center;
            }
            .dice-value {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <div class="select-group">
            <label>🎲 骰子数量</label>
            <select id="diceCountSelect" class="dice-count">
                <option value="1">1 颗</option>
                <option value="2">2 颗</option>
                <option value="3">3 颗</option>
                <option value="4" selected>4 颗</option>
                <option value="5">5 颗</option>
                <option value="6">6 颗</option>
                <option value="7">7 颗</option>
                <option value="8">8 颗</option>
                <option value="9">9 颗</option>
                <option value="10">10 颗</option>
                <option value="11">11 颗</option>
                <option value="12">12 颗</option>
            </select>
        </div>
        <button id="rollAllBtn" class="roll-all-btn">
            ✨ 全部投掷 ✨
        </button>
    </div>

    <div id="diceContainer" class="dice-grid">
        <!-- 动态骰子会在此渲染 -->
    </div>
    <div class="footer-note">
        ✦ 点击任意骰子单独投掷 ✦ 数量越多，骰子越精致 ✦
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 元素 ----------
        const diceContainer = document.getElementById('diceContainer');
        const diceCountSelect = document.getElementById('diceCountSelect');
        const rollAllBtn = document.getElementById('rollAllBtn');

        // 存储当前所有骰子的数据模型
        let diceItems = [];     // 每个元素: { canvas, valueSpan, currentValue, wrapper, size }
        let currentCount = 4;   // 默认4颗

        // ---------- 辅助函数：根据骰子数量计算出每个骰子的画布尺寸（正方形，像素）--------
        // 艺术感尺寸：数量增多，优雅缩小，保持精致比例
        function getDiceSizeByCount(count) {
            // 设计范围: 最小68px, 最大138px，随着数量增加线性/阶梯缩小
            if (count <= 2) return 138;
            if (count <= 4) return 120;
            if (count <= 6) return 102;
            if (count <= 8) return 88;
            if (count <= 10) return 78;
            return 70;   // 11-12颗
        }

        // ---------- 高级骰子绘制 (canvas 根据点数绘制标准骰点，美观质感) ----------
        function drawDice(canvas, size, value) {
            if (!canvas || !size) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            // 设置画布实际像素尺寸 (防止模糊)
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            
            // 底色: 柔和亚麻白 + 轻微渐变
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#fff9f0');
            grad.addColorStop(1, '#fef3e0');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 0;
            ctx.fillRect(0, 0, size, size);
            
            // 圆角边框 & 精致阴影 (内嵌外阴影效果)
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.12);
            ctx.clip();
            
            // 绘制微弱的内阴影边缘
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#e4cfaa';
            ctx.lineWidth = Math.max(1.5, size * 0.015);
            ctx.strokeRect(0, 0, size, size);
            
            // 增加一点高光氛围
            ctx.beginPath();
            ctx.roundRect(2, 2, size-4, size-4, size*0.1);
            ctx.strokeStyle = '#fff6e8';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // 绘制骰点 (精致的圆形, 带有径向渐变)
            const dotPositions = getDotPositions(value, size);
            for (let pos of dotPositions) {
                const x = pos.x;
                const y = pos.y;
                const radius = Math.max(3.5, size * 0.09);
                // 立体感圆点
                const gradDot = ctx.createRadialGradient(x - radius*0.2, y - radius*0.2, radius*0.2, x, y, radius);
                gradDot.addColorStop(0, '#2c2418');
                gradDot.addColorStop(0.8, '#1f1a10');
                gradDot.addColorStop(1, '#0e0b07');
                ctx.fillStyle = gradDot;
                ctx.shadowBlur = 2;
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                // 高光小白点
                ctx.fillStyle = '#f7e9cf';
                ctx.shadowBlur = 0.5;
                ctx.beginPath();
                ctx.arc(x - radius*0.25, y - radius*0.25, radius*0.25, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.restore();
            
            // 外轮廓精致圆角描边
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.12);
            ctx.strokeStyle = '#b4925c';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }
        
        // 辅助函数：canvas roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x+r, y);
                this.lineTo(x+w-r, y);
                this.quadraticCurveTo(x+w, y, x+w, y+r);
                this.lineTo(x+w, y+h-r);
                this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
                this.lineTo(x+r, y+h);
                this.quadraticCurveTo(x, y+h, x, y+h-r);
                this.lineTo(x, y+r);
                this.quadraticCurveTo(x, y, x+r, y);
                return this;
            };
        }
        
        // 获取点坐标 (标准化比例, 适应任何尺寸)
        function getDotPositions(value, size) {
            // 定义相对坐标 (0~1区间)
            const pointsMap = {
                1: [[0.5, 0.5]],
                2: [[0.25, 0.25], [0.75, 0.75]],
                3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
                4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
                5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
                6: [[0.25, 0.2], [0.5, 0.2], [0.75, 0.2], [0.25, 0.8], [0.5, 0.8], [0.75, 0.8]]
            };
            const points = pointsMap[value] || pointsMap[1];
            // 边缘偏移量，防止贴边太近
            const margin = size * 0.18;
            const innerW = size - margin * 2;
            return points.map(p => ({
                x: margin + p[0] * innerW,
                y: margin + p[1] * innerW
            }));
        }
        
        // ---------- 单个骰子投掷 (更新数值，重绘，加动画) ----------
        function rollSingleDice(index, withAnimation = true) {
            if (!diceItems[index]) return;
            const item = diceItems[index];
            const newValue = Math.floor(Math.random() * 6) + 1;
            item.currentValue = newValue;
            // 更新下方数字显示
            if (item.valueSpan) {
                item.valueSpan.textContent = newValue;
            }
            // 重绘画布 (画布尺寸从缓存中获取)
            const currentSize = item.size;
            if (item.canvas && currentSize) {
                drawDice(item.canvas, currentSize, newValue);
            }
            // 播放动态效果
            if (withAnimation && item.wrapper) {
                // 移除已有动画，重新触发
                item.wrapper.classList.remove('roll-animation');
                // 强制重绘动画小技巧
                void item.wrapper.offsetWidth;
                item.wrapper.classList.add('roll-animation');
                // 动画结束后移除class（保留干净）
                const onAnimEnd = () => {
                    if (item.wrapper) item.wrapper.classList.remove('roll-animation');
                    item.wrapper.removeEventListener('animationend', onAnimEnd);
                };
                item.wrapper.addEventListener('animationend', onAnimEnd, { once: true });
            }
        }
        
        // 全部投掷
        function rollAllDice() {
            for (let i = 0; i < diceItems.length; i++) {
                rollSingleDice(i, true);
            }
        }
        
        // 重置所有骰子尺寸 (当数量变化导致重设尺寸时调用)
        function resizeAllDiceByCount() {
            const newSize = getDiceSizeByCount(currentCount);
            for (let i = 0; i < diceItems.length; i++) {
                const item = diceItems[i];
                if (item.canvas) {
                    item.size = newSize;
                    drawDice(item.canvas, newSize, item.currentValue);
                }
            }
        }
        
        // ---------- 根据数量渲染全新的骰子组 (完全重建DOM) ----------
        function renderDiceByCount(count) {
            // 清空容器
            diceContainer.innerHTML = '';
            diceItems = [];
            
            const diceSize = getDiceSizeByCount(count);
            // 生成随机初始点数 (可选随机，使界面生动)
            for (let i = 0; i < count; i++) {
                const initValue = Math.floor(Math.random() * 6) + 1;
                
                // 创建骰子卡片容器
                const diceCard = document.createElement('div');
                diceCard.className = 'dice-card';
                diceCard.setAttribute('data-index', i);
                
                // 创建 canvas 元素
                const canvas = document.createElement('canvas');
                canvas.className = 'dice-canvas';
                canvas.setAttribute('aria-label', `骰子 ${i+1}`);
                
                // 创建下方数字span
                const valueSpan = document.createElement('span');
                valueSpan.className = 'dice-value';
                valueSpan.textContent = initValue;
                
                diceCard.appendChild(canvas);
                diceCard.appendChild(valueSpan);
                diceContainer.appendChild(diceCard);
                
                // 绘制骰子图形
                drawDice(canvas, diceSize, initValue);
                
                // 存储数据模型
                diceItems.push({
                    canvas: canvas,
                    valueSpan: valueSpan,
                    currentValue: initValue,
                    wrapper: diceCard,
                    size: diceSize,
                    index: i
                });
            }
            
            // 绑定每个卡片单独点击事件 (事件委托也可，但直接绑定更清晰)
            for (let idx = 0; idx < diceItems.length; idx++) {
                const card = diceItems[idx].wrapper;
                if (card) {
                    // 避免重复绑定，使用新函数
                    const handler = (e) => {
                        e.stopPropagation();
                        rollSingleDice(idx, true);
                    };
                    card.removeEventListener('click', card.diceClickHandler);
                    card.diceClickHandler = handler;
                    card.addEventListener('click', handler);
                }
            }
        }
        
        // 监听骰子数量的变化，重新生成
        function onCountChange() {
            const newCount = parseInt(diceCountSelect.value, 10);
            if (isNaN(newCount)) return;
            currentCount = newCount;
            renderDiceByCount(currentCount);
        }
        
        // 手动全部投掷按钮回调
        function onRollAll() {
            if (diceItems.length === 0) return;
            rollAllDice();
        }
        
        // 响应窗口尺寸变化时是否需要调整画布清晰度（通常不需要，但是为了保证高分辨率下优雅，检查尺寸变化重新绘制）
        // 但动态改变数量已经自动适配；如果用户缩放窗口，保持原样，无需额外处理（因为画布已经是固定px尺寸）
        
        // 可选: 监听select变化
        diceCountSelect.addEventListener('change', onCountChange);
        rollAllBtn.addEventListener('click', onRollAll);
        
        // 初始化默认骰子（4颗）
        renderDiceByCount(4);
        currentCount = 4;
        diceCountSelect.value = "4";
      
        
        // 增加一点额外艺术感: 动态波纹光效
        const styleAdd = document.createElement('style');
        styleAdd.textContent = `
            .dice-card:active canvas.dice-canvas {
                transform: scale(0.97);
                transition: transform 0.05s;
            }
            .dice-grid {
                transition: all 0.3s;
            }
            .roll-animation {
                animation: diceRollAnim 0.4s cubic-bezier(0.2, 0.9, 0.6, 1.1) !important;
            }
        `;
        document.head.appendChild(styleAdd);
        
        // 兼容额外保证canvas在全部投掷后如果有尺寸重绘的逻辑已经稳健
        // 暴露几个重置必要的安全机制：每次重绘时尺寸不变，但重绘的点根据新数值重绘，完美实现
        
        // 如果需要满足“多个骰子时单个点击，也可以有同时投出全部的按钮”已做
        // “下方要有数字”每个骰子下面有带渐变数字显示
        
        // 动态效果增强 - 添加悬浮粒子感
        const canvasElements = () => {
            // 纯粹装饰，不影响功能
        };
        
        // 增加投掷按钮振动式小反馈
        rollAllBtn.addEventListener('mousedown', () => {
            rollAllBtn.style.transform = 'scale(0.96)';
        });
        rollAllBtn.addEventListener('mouseup', () => {
            rollAllBtn.style.transform = '';
        });
        rollAllBtn.addEventListener('mouseleave', () => {
            rollAllBtn.style.transform = '';
        });
        
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>每日积分练习 | 不定积分训练器</title>
    <!-- KaTeX 数学渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- math.js 符号计算 & seedrandom 确定性随机数 -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
    <style>
        /* ==================== 全局样式 ==================== */
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --accent: #4a6cf7;
            --accent-hover: #3b5de7;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --input-bg: #f8fafc;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 20px;
        }

        .main-layout {
            display: flex;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .content-area {
            flex: 1 1 700px;
            min-width: 0;
        }

        .keypad-sidebar {
            flex: 0 0 290px;
            position: sticky;
            top: 20px;
            align-self: flex-start;
        }

        /* 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b, #2d3a4e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .date {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 6px;
        }

        .status-message {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 500;
            background: #94a3b8;
            color: white;
            padding: 5px 20px;
            border-radius: 40px;
            margin-top: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .status-message.checked-in {
            background: var(--success);
        }

        /* 题目卡片 */
        .problems-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 30px;
        }

        .problem-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .problem-card.wrong-highlight {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        .problem-card.correct-highlight {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        .problem-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .problem-number {
            font-weight: 700;
            font-size: 0.85rem;
            background: #eef2ff;
            padding: 3px 12px;
            border-radius: 20px;
            color: var(--accent);
        }

        .reveal-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            padding: 4px 10px;
            border-radius: 20px;
            transition: all 0.15s;
        }

        .reveal-btn:hover:not(.viewed) {
            background: #f1f5f9;
            color: #1e293b;
        }

        .reveal-btn.viewed {
            color: #94a3b8;
            text-decoration: line-through;
            cursor: default;
            background: transparent;
        }

        .integral-display {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 1.35rem;
            text-align: center;
            overflow-x: auto;
            white-space: nowrap;
            border-left: 4px solid var(--accent);
        }

        .answer-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .answer-input {
            flex: 1;
            padding: 11px 14px;
            font-size: 1rem;
            font-family: var(--font-mono);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            outline: none;
            transition: all 0.2s;
        }

        .answer-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        .answer-input:disabled {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .answer-input.input-error {
            border-color: var(--danger);
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
        }

        .result-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .result-icon.wrong {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .correct-answer-display {
            font-size: 0.95rem;
            font-family: var(--font-mono);
            background: #f0fdf4;
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 8px;
            border-left: 3px solid var(--success);
        }

        .preview-latex {
            font-size: 0.9rem;
            color: #475569;
            background: #fefce8;
            padding: 6px 12px;
            border-radius: 8px;
            min-height: 2.4em;
            word-break: break-all;
        }

        .error-message {
            font-size: 0.75rem;
            color: var(--danger);
            display: none;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 8px rgba(74,108,247,0.2);
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #cbd5e1;
            color: #5c6b7e;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 16px;
            text-align: center;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 20px;
        }

        /* 键盘面板 */
        .keypad-panel {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .keypad-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #475569;
            text-align: center;
        }

        .keypad-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .keypad-btn {
            padding: 8px 0;
            width: 48px;
            font-family: var(--font-mono);
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .keypad-btn:hover {
            background: #eef2ff;
            border-color: var(--accent);
        }

        .keypad-btn.func {
            width: auto;
            min-width: 58px;
            font-size: 0.8rem;
        }

        .keypad-btn.wide {
            width: auto;
            min-width: 70px;
        }

        @media (max-width: 780px) {
            .main-layout {
                flex-direction: column;
            }
            .keypad-sidebar {
                position: static;
                width: 100%;
            }
            .keypad-btn {
                width: 42px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="main-layout">
    <div class="content-area" id="app">
        <div class="header">
            <h1>📐 每日积分练习</h1>
            <p class="date" id="date-display"></p>
            <div class="status-message" id="status-badge">今日未打卡</div>
        </div>
        <div class="problems-list" id="problems-container"></div>
        <div class="actions">
            <button class="btn" id="submit-all-btn">✨ 提交全部答案</button>
        </div>
        <div class="input-hint">
            💡 支持省略乘号 (如 3x 等价 3*x) · 常数 C 可省略 · 使用右侧虚拟键盘快速输入
        </div>
    </div>
    <div class="keypad-sidebar" id="keypad-container"></div>
</div>

<script>
    // ======================== 统一整合脚本 ========================
    // 包含: math-utils, templates, keypad, app 全部逻辑，并增强隐式乘法 + localStorage打卡持久化
    (function(){
        // ---------- 1. 工具函数与隐式乘法预处理 ----------
        // 增强表达式: 将 "2x" -> "2*x" , "xsin(x)" -> "x*sin(x)" 等，提高解析宽容度
        function preprocessImplicitMultiplication(expr) {
            if (!expr || typeof expr !== 'string') return expr;
            let processed = expr.trim();
            // 数字后跟字母 或 数字后跟左括号 -> 插入乘号 (例如 2x -> 2*x, 3sin -> 3*sin)
            processed = processed.replace(/(\d)([a-zA-Z(])/g, '$1*$2');
            // 字母或右括号后跟字母/数字/左括号 (例如 xsin -> x*sin, )x -> )*x)
            processed = processed.replace(/([a-zA-Z)])([a-zA-Z(])/g, '$1*$2');
            // 右括号后跟数字 -> )*数字
            processed = processed.replace(/(\))(\d)/g, '$1*$2');
            // 处理 x^2y 等情况：^后跟数字再接字母变成幂乘
            processed = processed.replace(/(\^[\d]+)([a-zA-Z(])/g, '$1*$2');
            return processed;
        }

        // 随机整数生成器
        function randInt(min, max, rng) {
            return Math.floor(rng() * (max - min + 1)) + min;
        }

        // 表达式语法校验 (预处理后校验)
        function validateExpression(expr) {
            if (!expr || expr.trim() === '') return { valid: true };
            try {
                const processed = preprocessImplicitMultiplication(expr);
                math.parse(processed);
                return { valid: true };
            } catch (e) {
                return { valid: false, error: e.message };
            }
        }

        // 核心验证: 用户答案 vs 标准原函数 F(x)，通过数值采样验证是否相差常数
        function checkAnswer(userInput, standardFStr) {
            if (!userInput || userInput.trim() === '') return false;
            try {
                // 1. 预处理隐式乘法 & 处理独立常数C (替换为0)
                let processedUser = preprocessImplicitMultiplication(userInput);
                processedUser = processedUser.replace(/\bC\b/g, '0');
                // 2. 编译标准原函数与用户函数
                const stdNode = math.parse(standardFStr);
                const userNode = math.parse(processedUser);
                const stdCompiled = stdNode.compile();
                const userCompiled = userNode.compile();
                // 3. 采样点 [-5,5] 避开奇点较少的区域
                const samples = [];
                for (let i = 0; i <= 20; i++) {
                    const x = -4 + (8 * i) / 20;  // -4 到 4 更安全
                    samples.push(x);
                }
                const diffs = [];
                for (const x of samples) {
                    try {
                        const yStd = stdCompiled.evaluate({ x });
                        const yUser = userCompiled.evaluate({ x });
                        if (isFinite(yStd) && isFinite(yUser) && !isNaN(yStd) && !isNaN(yUser)) {
                            diffs.push(yUser - yStd);
                        }
                    } catch(e) { continue; }
                }
                if (diffs.length < 8) return false;
                // 取前10个差值，检查极差
                const selected = diffs.slice(0, 12);
                const maxDiff = Math.max(...selected);
                const minDiff = Math.min(...selected);
                const range = maxDiff - minDiff;
                return range < 1e-4;   // 常数差容差
            } catch(e) {
                console.debug("验证异常", e);
                return false;
            }
        }

        // 将表达式转为LaTeX (美化)
        function toTexSafe(exprStr) {
            if (!exprStr) return '';
            try {
                const node = math.parse(exprStr);
                return node.toTex();
            } catch(e) { return null; }
        }

        function beautifyTex(tex) {
            if (!tex) return tex;
            return tex.replace(/(\d)\\cdot\s*([a-zA-Z\\])/g, '$1$2');
        }

        function renderLatex(tex, element) {
            if (!tex || !element) return;
            try {
                katex.render(beautifyTex(tex), element, { throwOnError: false });
            } catch(e) {
                element.textContent = tex;
            }
        }

        // ---------- 2. 积分题目模板 (15种) ----------
        const integralTemplates = (function (randIntFn) {
            return [
                function (rng) { let a = randIntFn(1,3,rng), b = randIntFn(0,3,rng), n = randIntFn(2,4,rng), n1 = n+1; return { F: `(1/(${a}*${n1}))*(${a}*x+${b})^${n1}` }; },
                function (rng) { let a = randIntFn(1,3,rng), n = randIntFn(2,3,rng), n1 = n+1; return { F: `sin(${a}*x)^${n1}/(${a}*${n1})` }; },
                function (rng) { let a = randIntFn(1,3,rng), n = randIntFn(2,3,rng), n1 = n+1; return { F: `-cos(${a}*x)^${n1}/(${a}*${n1})` }; },
                function (rng) { let a = randIntFn(1,3,rng), n = randIntFn(1,2,rng); if(n===1) return { F: `exp(${a}*x)*(x/${a} - 1/${a}^2)` }; else return { F: `exp(${a}*x)*(x^2/${a} - 2*x/${a}^2 + 2/${a}^3)` }; },
                function (rng) { let a = randIntFn(1,3,rng); return { F: `(sin(${a}*x) - ${a}*x*cos(${a}*x))/${a}^2` }; },
                function (rng) { let a = randIntFn(1,3,rng); return { F: `(cos(${a}*x) + ${a}*x*sin(${a}*x))/${a}^2` }; },
                function (rng) { let a = randIntFn(1,3,rng), b = randIntFn(1,3,rng); return { F: `exp(${a}*x)*(${a}*sin(${b}*x) - ${b}*cos(${b}*x))/(${a}^2+${b}^2)` }; },
                function (rng) { let a = randIntFn(1,3,rng), b = randIntFn(1,3,rng); return { F: `exp(${a}*x)*(${a}*cos(${b}*x) + ${b}*sin(${b}*x))/(${a}^2+${b}^2)` }; },
                function (rng) { let a = randIntFn(1,3,rng), n = randIntFn(1,2,rng); if(n===1) return { F: `x^2/2*log(${a}*x) - x^2/4` }; else return { F: `x^3/3*log(${a}*x) - x^3/9` }; },
                function (rng) { let a = randIntFn(1,3,rng); return { F: `(1/${a})*atan(x/${a})` }; },
                function (rng) { let a = randIntFn(2,4,rng); return { F: `asin(x/${a})` }; },
                function (rng) { let a = randIntFn(1,3,rng), b = randIntFn(0,3,rng); return { F: `(2/(3*${a}))*(${a}*x+${b})^(3/2)` }; },
                function (rng) { let a = randIntFn(1,5,rng); return { F: `sqrt(x^2+${a})` }; },
                function (rng) { let a = randIntFn(1,3,rng), b = randIntFn(1,3,rng); while(a===b) b = randIntFn(1,3,rng); return { F: `-cos((${a}-${b})*x)/(2*(${a}-${b})) - cos((${a}+${b})*x)/(2*(${a}+${b}))` }; },
                function () { return { F: `0.5*x^2*atan(x) - x/2 + 0.5*atan(x)` }; }
            ];
        })(randInt);

        // ---------- 3. 题目生成器 (基于日期种子) ----------
        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function generateProblems(seed) {
            const rng = new Math.seedrandom(seed);
            const templates = integralTemplates;
            const problems = [];
            for(let i = 0; i < 5; i++) {
                const idx = Math.floor(rng() * templates.length);
                const { F } = templates[idx](rng);
                let F_node, f_node, f_simplified;
                try {
                    F_node = math.parse(F);
                    f_node = math.derivative(F_node, math.parse('x'));
                    f_simplified = math.simplify(f_node);
                } catch(e) {
                    const a = randInt(1,3,rng), n = randInt(2,4,rng);
                    const fallback = `(1/(${a}*${n+1}))*(${a}*x)^${n+1}`;
                    F_node = math.parse(fallback);
                    f_node = math.derivative(F_node, math.parse('x'));
                    f_simplified = math.simplify(f_node);
                }
                let displayTex = '';
                try { displayTex = math.simplify(F_node).toTex(); } catch(e) { displayTex = F_node.toTex(); }
                problems.push({
                    id: i,
                    F_str: F,                // 标准原函数（无常数C）
                    displayTex: displayTex,
                    fStr: f_simplified.toString(),
                    viewedAnswer: false,
                    userAnswer: '',
                    lastResult: null
                });
            }
            return problems;
        }

        // ---------- 4. 打卡存储 (localStorage) ----------
        let checkedIn = false;
        let currentProblems = [];
        let todayStr = getTodayString();

        function loadCheckInStatus() {
            const stored = localStorage.getItem('integral_checkin_date');
            if(stored === todayStr) {
                checkedIn = true;
            } else {
                checkedIn = false;
            }
        }

        function setCheckedIn() {
            localStorage.setItem('integral_checkin_date', todayStr);
            checkedIn = true;
            updateUIBasedOnCheckin();
        }

        // 全局UI元素
        let submitBtn, statusBadge, problemsContainer;

        // 更新打卡后的界面禁用 & 显示所有正确答案
        function updateUIBasedOnCheckin() {
            statusBadge.textContent = checkedIn ? '✅ 今日已打卡' : '📅 今日未打卡';
            statusBadge.className = `status-message ${checkedIn ? 'checked-in' : ''}`;
            if(submitBtn) submitBtn.disabled = checkedIn;
            if(!currentProblems) return;
            currentProblems.forEach(prob => {
                const cardDom = prob._card;
                const inputEl = prob._input;
                const correctDiv = prob._correctDiv;
                const revealBtnDom = prob._revealBtn;
                if(checkedIn) {
                    if(inputEl) { inputEl.disabled = true; }
                    if(correctDiv) {
                        renderLatex(prob.displayTex + ' + C', correctDiv);
                        correctDiv.style.display = 'block';
                    }
                    if(revealBtnDom) {
                        revealBtnDom.disabled = true;
                        revealBtnDom.classList.add('viewed');
                    }
                    // 清除错误高亮，显示已打卡标志
                    if(prob._card) prob._card.classList.remove('wrong-highlight','correct-highlight');
                    if(prob._icon) {
                        prob._icon.textContent = '✓';
                        prob._icon.className = 'result-icon';
                    }
                } else {
                    // 未打卡则根据是否看过答案决定
                    if(prob.viewedAnswer){
                        if(inputEl) inputEl.disabled = true;
                        if(correctDiv) correctDiv.style.display = 'block';
                        if(revealBtnDom) revealBtnDom.classList.add('viewed');
                    } else {
                        if(inputEl && !checkedIn) inputEl.disabled = false;
                        if(correctDiv && !prob.viewedAnswer) correctDiv.style.display = 'none';
                    }
                }
            });
        }

        // ---------- 5. 渲染题目 ----------
        function renderProblems() {
            problemsContainer.innerHTML = '';
            currentProblems.forEach((prob, idx) => {
                const card = document.createElement('div');
                card.className = 'problem-card';
                card.dataset.id = prob.id;

                // header
                const headerDiv = document.createElement('div');
                headerDiv.className = 'problem-header';
                const numSpan = document.createElement('span');
                numSpan.className = 'problem-number';
                numSpan.textContent = `第 ${idx+1} 题`;
                const revealBtn = document.createElement('button');
                revealBtn.className = `reveal-btn ${prob.viewedAnswer ? 'viewed' : ''}`;
                revealBtn.textContent = prob.viewedAnswer ? '已查看答案' : '🔍 显示答案';
                revealBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if(checkedIn || prob.viewedAnswer) return;
                    if(confirm('⚠️ 查看答案后本题将无法计入“全对打卡”，确定继续吗？')) {
                        prob.viewedAnswer = true;
                        prob.userAnswer = '';
                        prob.lastResult = 'wrong';
                        if(prob._input) {
                            prob._input.disabled = true;
                            prob._input.value = '';
                        }
                        if(prob._correctDiv) {
                            renderLatex(prob.displayTex + ' + C', prob._correctDiv);
                            prob._correctDiv.style.display = 'block';
                        }
                        revealBtn.textContent = '已查看答案';
                        revealBtn.classList.add('viewed');
                        if(prob._icon) {
                            prob._icon.textContent = '✗';
                            prob._icon.classList.add('wrong');
                        }
                        card.classList.add('wrong-highlight');
                    }
                });
                headerDiv.appendChild(numSpan);
                headerDiv.appendChild(revealBtn);

                // 积分显示区
                const integralDiv = document.createElement('div');
                integralDiv.className = 'integral-display';
                const fTex = toTexSafe(prob.fStr);
                const integralTex = fTex ? `\\int \\left( ${fTex} \\right) \\mathrm{d}x` : `∫ (${prob.fStr}) dx`;
                renderLatex(integralTex, integralDiv);

                // 答案区
                const answerArea = document.createElement('div');
                answerArea.className = 'answer-area';
                const inputRow = document.createElement('div');
                inputRow.className = 'answer-input-row';
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'answer-input';
                input.placeholder = '例如: (1/3)*x^3 或 sin(2*x)';
                input.value = prob.userAnswer || '';
                input.disabled = checkedIn || prob.viewedAnswer;
                const iconSpan = document.createElement('span');
                iconSpan.className = 'result-icon';
                inputRow.appendChild(input);
                inputRow.appendChild(iconSpan);
                const errorMsgDiv = document.createElement('div');
                errorMsgDiv.className = 'error-message';
                const previewDiv = document.createElement('div');
                previewDiv.className = 'preview-latex';
                previewDiv.style.marginTop = '6px';
                answerArea.appendChild(inputRow);
                answerArea.appendChild(errorMsgDiv);
                answerArea.appendChild(previewDiv);

                const correctDivAnswer = document.createElement('div');
                correctDivAnswer.className = 'correct-answer-display';
                correctDivAnswer.style.display = (checkedIn || prob.viewedAnswer) ? 'block' : 'none';
                if(checkedIn || prob.viewedAnswer) renderLatex(prob.displayTex + ' + C', correctDivAnswer);

                card.appendChild(headerDiv);
                card.appendChild(integralDiv);
                card.appendChild(answerArea);
                card.appendChild(correctDivAnswer);
                problemsContainer.appendChild(card);

                // 存储关联DOM
                prob._card = card;
                prob._input = input;
                prob._icon = iconSpan;
                prob._correctDiv = correctDivAnswer;
                prob._revealBtn = revealBtn;
                prob._errorMsg = errorMsgDiv;
                prob._previewDiv = previewDiv;

                // 实时预览和语法检查
                input.addEventListener('input', () => {
                    prob.userAnswer = input.value;
                    if(prob.lastResult) {
                        prob.lastResult = null;
                        card.classList.remove('wrong-highlight','correct-highlight');
                        iconSpan.textContent = '';
                        iconSpan.className = 'result-icon';
                    }
                    const validation = validateExpression(input.value);
                    if(!validation.valid && input.value.trim() !== '') {
                        input.classList.add('input-error');
                        errorMsgDiv.textContent = '❌ 表达式语法错误';
                        errorMsgDiv.style.display = 'block';
                        previewDiv.innerHTML = '';
                    } else {
                        input.classList.remove('input-error');
                        errorMsgDiv.style.display = 'none';
                        if(input.value.trim() !== '') {
                            const previewTex = toTexSafe(preprocessImplicitMultiplication(input.value));
                            if(previewTex) renderLatex(previewTex, previewDiv);
                            else previewDiv.textContent = '(预览)';
                        } else previewDiv.innerHTML = '';
                    }
                });
                // 触发初始预览
                if(prob.userAnswer) input.dispatchEvent(new Event('input'));
            });
            updateUIBasedOnCheckin();
        }

        // 提交全部
        function handleSubmitAll() {
            if(checkedIn) {
                alert('今日已完成打卡，无法再次提交。明日再来挑战吧！');
                return;
            }
            let allCorrect = true;
            let hasViewed = false;
            for(const prob of currentProblems) {
                if(prob.viewedAnswer) {
                    hasViewed = true;
                    allCorrect = false;
                    if(prob._icon) {
                        prob._icon.textContent = '✗';
                        prob._icon.classList.add('wrong');
                    }
                    prob._card.classList.add('wrong-highlight');
                    continue;
                }
                const userAns = prob._input.value.trim();
                prob.userAnswer = userAns;
                const isCorrect = checkAnswer(userAns, prob.F_str);
                prob.lastResult = isCorrect ? 'correct' : 'wrong';
                if(prob._icon) {
                    prob._icon.textContent = isCorrect ? '✓' : '✗';
                    prob._icon.className = `result-icon ${!isCorrect ? 'wrong' : ''}`;
                }
                prob._card.classList.remove('wrong-highlight','correct-highlight');
                prob._card.classList.add(isCorrect ? 'correct-highlight' : 'wrong-highlight');
                if(!isCorrect) allCorrect = false;
            }
            if(allCorrect && !hasViewed) {
                // 打卡成功！
                setCheckedIn();
                alert('🎉 恭喜！全部5道积分题解答正确！今日打卡成功 🎉');
                // 刷新界面锁定状态并显示所有正确答案
                for(const prob of currentProblems) {
                    if(prob._correctDiv) {
                        renderLatex(prob.displayTex + ' + C', prob._correctDiv);
                        prob._correctDiv.style.display = 'block';
                    }
                    if(prob._input) prob._input.disabled = true;
                    if(prob._revealBtn) {
                        prob._revealBtn.disabled = true;
                        prob._revealBtn.classList.add('viewed');
                    }
                }
                submitBtn.disabled = true;
            } else if(!allCorrect) {
                const firstWrong = document.querySelector('.problem-card.wrong-highlight');
                if(firstWrong) firstWrong.scrollIntoView({ behavior: 'smooth', block: 'center' });
                alert('❌ 部分答案不正确，请根据提示修改后重试。');
            } else if(hasViewed && allCorrect) {
                alert('📖 已查看过答案，无法打卡。明天可关闭答案后独立完成。');
            }
        }

        // ---------- 6. 数学键盘 (独立组件) ----------
        function initKeypad() {
            const container = document.getElementById('keypad-container');
            if(!container) return;
            let currentInput = null;
            document.addEventListener('focusin', (e) => {
                if(e.target && e.target.classList && e.target.classList.contains('answer-input')) {
                    currentInput = e.target;
                }
            });
            function insertText(text) {
                if(!currentInput || currentInput.disabled) return;
                const start = currentInput.selectionStart;
                const end = currentInput.selectionEnd;
                const val = currentInput.value;
                currentInput.value = val.substring(0, start) + text + val.substring(end);
                const newPos = start + text.length;
                currentInput.setSelectionRange(newPos, newPos);
                currentInput.focus();
                currentInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            function backspace() {
                if(!currentInput || currentInput.disabled) return;
                const start = currentInput.selectionStart, end = currentInput.selectionEnd;
                if(start !== end) {
                    currentInput.value = currentInput.value.substring(0, start) + currentInput.value.substring(end);
                    currentInput.setSelectionRange(start, start);
                } else if(start > 0) {
                    const newVal = currentInput.value.substring(0, start-1) + currentInput.value.substring(start);
                    currentInput.value = newVal;
                    currentInput.setSelectionRange(start-1, start-1);
                }
                currentInput.focus();
                currentInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            const panel = document.createElement('div');
            panel.className = 'keypad-panel';
            panel.innerHTML = '<div class="keypad-title">🧮 虚拟数学键盘</div>';
            const grid = document.createElement('div');
            grid.className = 'keypad-grid';
            const rows = [
                ['x','1','2','3','4','5','6','7','8','9','0'],
                ['+','-','*','/','^','(',')'],
                ['sin(','cos(','tan(','arcsin(','arccos(','arctan(','log('],
                ['_','C','=','sqrt(']
            ];
            rows.forEach(row => {
                row.forEach(sym => {
                    const btn = document.createElement('button');
                    btn.className = 'keypad-btn' + (sym.length>1 && sym.includes('(') ? ' func' : '');
                    btn.textContent = sym;
                    btn.addEventListener('click', (e) => { e.preventDefault(); insertText(sym); });
                    grid.appendChild(btn);
                });
            });
            const backBtn = document.createElement('button'); backBtn.textContent = '⌫ 退格'; backBtn.className = 'keypad-btn wide';
            backBtn.addEventListener('click', backspace);
            const clearBtn = document.createElement('button'); clearBtn.textContent = '🗑️ 清空'; clearBtn.className = 'keypad-btn wide';
            clearBtn.addEventListener('click', () => { if(currentInput && !currentInput.disabled) { currentInput.value = ''; currentInput.dispatchEvent(new Event('input')); currentInput.focus(); } });
            grid.appendChild(backBtn);
            grid.appendChild(clearBtn);
            panel.appendChild(grid);
            container.appendChild(panel);
        }

        // ---------- 7. 启动应用 ----------
        function initApp() {
            dateDisplay = document.getElementById('date-display');
            statusBadge = document.getElementById('status-badge');
            problemsContainer = document.getElementById('problems-container');
            submitBtn = document.getElementById('submit-all-btn');
            if(dateDisplay) dateDisplay.textContent = todayStr;
            loadCheckInStatus();
            currentProblems = generateProblems(todayStr);
            renderProblems();
            submitBtn.addEventListener('click', handleSubmitAll);
            initKeypad();
        }
        window.addEventListener('DOMContentLoaded', initApp);
    })();
</script>

    body.dream-mode {

      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="27" viewBox="0 0 24 27"><circle cx="12" cy="12" r="10" fill="%23ffb7c5" stroke="%23ffffff" stroke-width="1.5" /><path fill="%23ff6f91" d="M12 6 L13.5 10 L18 10 L14.5 12.5 L16 17 L12 14 L8 17 L9.5 12.5 L6 10 L10.5 10z" /></svg>') 12 5, auto;

    }

      backdrop-filter: blur(10px);
      border-radius: 50px;
      padding: 12px 28px;
      box-shadow: 0 8px 20px rgba(255, 180, 180, 0.25);

    body.dream-mode nav a:hover {

    }
    body.dream-mode .profile-section,
    body.dream-mode .about-card {
      background: rgba(255, 250, 245, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 25px rgba(245, 165, 180, 0.25);
      border-radius: 40px;
    }
    body.dream-mode .name-title h1 {
      background: linear-gradient(125deg, #ff7f9f, #ffb347, #ff9eb5);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-family: 'Quicksand', 'Comfortaa', sans-serif;
    }
    body.dream-mode .name-title .signature {
      color: #c28297;
      border-left-color: #ffb3c6;
    }
    body.dream-mode .about-card h2 {
      color: #de6e8f;

    }
    body.dream-mode .tag {
      background: rgba(255, 235, 240, 0.8);

    }
    body.dream-mode .tag:hover {

    }
    body.dream-mode .theme-switch-btn {
      border-color: #ffb3c6;
      color: #ff7099;
      background: rgba(255,255,255,0.6);
    }
    body.dream-mode .theme-switch-btn:hover {
      background: #ffe0e8;
    }
    /* 梦幻气泡、星星等由 JS 动态生成，此处仅定义基础 */
    .dream-bubble {
      position: fixed;
      background: radial-gradient(circle at 30% 30%, rgba(255, 220, 230, 0.6), rgba(255, 190, 210, 0.3));
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(255, 140, 160, 0.2);
      animation: floatBubble linear infinite;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    @keyframes floatBubble {
      0% { transform: translateY(100vh) scale(0.4); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
    }
    .star-bling {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: starFloat 0.7s ease-out forwards;
    }
    @keyframes starFloat {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx, 20px), var(--dy, -40px)) scale(1.5); }
    }
    .click-heart {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      animation: heartPop 0.6s ease-out forwards;
    }
    @keyframes heartPop {
      0% { opacity: 0.9; transform: scale(0.3) translateY(0); }
      50% { opacity: 1; transform: scale(1.2) translateY(-15px); }
      100% { opacity: 0; transform: scale(1.5) translateY(-35px); }
    }

  <script>
    // ========== 梦幻模式切换逻辑 ==========
    const toggleBtn = document.getElementById('themeToggle');
    const body = document.body;
    let dreamMode = false; // 默认简约风
    let bubbleContainer, starListener, clickListener;

    // 清理梦幻特效
    function removeDreamEffects() {
      if (bubbleContainer) {
        bubbleContainer.remove();
        bubbleContainer = null;
      }
      if (starListener) {
        document.removeEventListener('mousemove', starListener);
        starListener = null;
      }
      if (clickListener) {
        document.body.removeEventListener('click', clickListener);
        clickListener = null;
      }
      // 移除所有漂浮元素
      document.querySelectorAll('.dream-bubble, .star-bling, .click-heart').forEach(el => el.remove());
    }

    // 创建梦幻特效
    function createDreamEffects() {
      // 气泡容器
      bubbleContainer = document.createElement('div');
      bubbleContainer.style.position = 'fixed';
      bubbleContainer.style.top = '0';
      bubbleContainer.style.left = '0';
      bubbleContainer.style.width = '100%';
      bubbleContainer.style.height = '100%';
      bubbleContainer.style.pointerEvents = 'none';
      bubbleContainer.style.zIndex = '1';
      document.body.appendChild(bubbleContainer);

      // 生成气泡
      for (let i = 0; i < 28; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'dream-bubble';
        const size = Math.random() * 70 + 25;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.animationDuration = (Math.random() * 12 + 8) + 's';
        bubble.style.animationDelay = (Math.random() * 12) + 's';
        bubbleContainer.appendChild(bubble);
      }

      // 鼠标星星特效（节流）
      let starCooldown = false;
      starListener = function(e) {
        if (starCooldown) return;
        starCooldown = true;
        setTimeout(() => { starCooldown = false; }, 70);
        const star = document.createElement('div');
        star.className = 'star-bling';
        const icons = ['✨', '⭐', '🌟', '💖', '🌸', '🍬', '🍰', '🐣'];
        star.textContent = icons[Math.floor(Math.random() * icons.length)];
        star.style.left = (e.clientX - 8) + 'px';
        star.style.top = (e.clientY - 12) + 'px';
        star.style.setProperty('--dx', (Math.random() - 0.5) * 40 + 'px');
        star.style.setProperty('--dy', -Math.random() * 45 - 15 + 'px');
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 700);
      };
      document.addEventListener('mousemove', starListener);

      // 点击爱心特效
      clickListener = function(e) {
        const heart = document.createElement('div');
        heart.className = 'click-heart';
        const love = ['❤️', '💗', '🧡', '💖', '🌸', '✨'];
        heart.textContent = love[Math.floor(Math.random() * love.length)];
        heart.style.left = (e.clientX - 10) + 'px';
        heart.style.top = (e.clientY - 15) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 600);
      };
      document.body.addEventListener('click', clickListener);
    }

    // 切换按钮点击
    toggleBtn.addEventListener('click', () => {
      dreamMode = !dreamMode;
      if (dreamMode) {
        body.classList.add('dream-mode');
        toggleBtn.textContent = '🍃 返回简约';
        createDreamEffects();
      } else {
        body.classList.remove('dream-mode');
        toggleBtn.textContent = '🌈 新世界';
        removeDreamEffects();
      }
    });

    // 初始状态：简约模式，无需特效
  </script>

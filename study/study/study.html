<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>每日积分练习 | 不定积分训练器</title>
    <!-- 外部库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
    <!-- 自定义样式与脚本（顺序依赖） -->
    <link rel="stylesheet" href="css/study.css">
</head>
<body>
    <div class="main-layout">
        <div class="content-area" id="app">
            <div class="header">
                <h1>📐 每日积分练习——答案验证部分还有些bug，所以对不了答案</h1>
                <p class="date" id="date-display"></p>
                <div class="status-message" id="status-badge">今日未打卡</div>
            </div>
            <div class="problems-list" id="problems-container"></div>
            <div class="actions">
                <button class="btn" id="submit-all-btn">✨ 提交全部答案</button>
            </div>
            <div class="input-hint">
                💡 支持省略乘号 (如 3x 等价 3*x) · 常数 C 可省略 · 使用右侧虚拟键盘快速输入
            </div>
        </div>
        <div class="keypad-sidebar" id="keypad-container"></div>
    </div>

    <!-- 脚本：顺序不可变 -->
    <script src="js/utils.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
